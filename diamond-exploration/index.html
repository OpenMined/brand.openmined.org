<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined — Diamond Exploration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
  if (!gl) { document.body.textContent = 'WebGL not supported'; return; }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  const vsSource = `
    attribute vec2 aPos;
    varying vec2 vUV;
    void main() {
      vUV = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  const fsSource = `
    precision highp float;
    varying vec2 vUV;
    uniform float uTime;
    uniform vec2 uResolution;
    uniform vec2 uMouse;

    vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }
    float snoise(vec2 v){
      const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
      vec2 i = floor(v + dot(v, C.yy));
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
      vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
      i = mod289(i);
      vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
      vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
      m = m*m; m = m*m;
      vec3 x = 2.0*fract(p*C.www) - 1.0;
      vec3 h = abs(x) - 0.5;
      vec3 ox = floor(x + 0.5);
      vec3 a0 = x - ox;
      m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
      vec3 g; g.x = a0.x*x0.x + h.x*x0.y; g.yz = a0.yz*x12.xz + h.yz*x12.yw;
      return 130.0 * dot(m, g);
    }

    // Warm palette
    vec3 warmColor(float v) {
      vec3 top    = vec3(0.80, 0.16, 0.48);
      vec3 mid    = vec3(0.96, 0.67, 0.12);
      vec3 bottom = vec3(0.92, 0.25, 0.10);
      if (v < 0.5) return mix(top, mid, v * 2.0);
      return mix(mid, bottom, (v - 0.5) * 2.0);
    }

    // Cool palette
    vec3 coolColor(float v) {
      vec3 top    = vec3(0.55, 0.78, 0.16);
      vec3 mid    = vec3(0.06, 0.60, 0.40);
      vec3 bottom = vec3(0.0, 0.63, 0.63);
      if (v < 0.5) return mix(top, mid, v * 2.0);
      return mix(mid, bottom, (v - 0.5) * 2.0);
    }

    void main() {
      vec2 uv = vUV;
      float aspect = uResolution.x / uResolution.y;
      float flow = uTime * 0.06;

      // Diamond center
      vec2 dCenter = vec2(0.5, 0.5);
      float dSize = 0.22;

      // Aspect-corrected coordinates relative to diamond center
      vec2 p = vec2((uv.x - dCenter.x) * aspect, uv.y - dCenter.y);

      // Noise-modulated edges
      float edgeNoise = snoise(vec2(uv.x * 4.0 - flow, uv.y * 4.0 + uTime * 0.04)) * 0.012
                      + snoise(vec2(uv.x * 8.0 + flow * 0.7, uv.y * 8.0 - uTime * 0.03)) * 0.006;

      // Diamond SDF
      float dist = (abs(p.x) + abs(p.y)) - dSize + edgeNoise;

      // Gaussian soft falloff — same approach as stream
      float sigma = 0.04;
      float outerSigma = 0.06;
      float gauss = exp(-(max(dist, 0.0) * max(dist, 0.0)) / (2.0 * sigma * sigma));
      float outerGauss = exp(-(max(dist, 0.0) * max(dist, 0.0)) / (2.0 * outerSigma * outerSigma));
      float alpha = dist < 0.0 ? 1.0 : mix(outerGauss, gauss, 0.5);

      // Noise on alpha
      float alphaNoise = snoise(vec2(uv.x * 5.0 - flow * 1.5, uv.y * 5.0 + uTime * 0.03)) * 0.08;
      alpha = clamp(alpha + alphaNoise * alpha, 0.0, 1.0);
      alpha = pow(alpha, 0.55);
      alpha *= smoothstep(0.0, 0.03, alpha);

      // Color: diagonal position within diamond + noise
      float vPos = clamp((-p.x + p.y) / (dSize * 2.0) + 0.5, 0.0, 1.0);
      float vNoise = snoise(vec2(uv.x * 3.0 - flow * 2.0 + 20.0, uv.y * 4.0 - uTime * 0.04)) * 0.13;
      vPos = clamp(vPos + vNoise, 0.0, 1.0);

      vec3 warm = warmColor(vPos);
      vec3 cool = coolColor(vPos);

      float warmCoolMix = smoothstep(0.38, 0.58, uv.x);
      float transNoise = snoise(vec2(uv.x * 2.0 + 50.0, uv.y * 3.0 + uTime * 0.05)) * 0.08;
      warmCoolMix = clamp(warmCoolMix + transNoise, 0.0, 1.0);

      vec3 color = mix(warm, cool, warmCoolMix);
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      color = mix(vec3(lum), color, 1.0);

      // Composite over white
      vec3 white = vec3(1.0);
      vec3 final = mix(white, color, alpha * 0.96);

      gl_FragColor = vec4(final, 1.0);
    }
  `;

  function createShader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  const vs = createShader(gl.VERTEX_SHADER, vsSource);
  const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  const aPos = gl.getAttribLocation(prog, 'aPos');
  const uTime = gl.getUniformLocation(prog, 'uTime');
  const uRes = gl.getUniformLocation(prog, 'uResolution');
  const uMouse = gl.getUniformLocation(prog, 'uMouse');

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  let mx = 0.5, my = 0.5, smx = 0.5, smy = 0.5;
  document.addEventListener('mousemove', function(e) {
    mx = e.clientX / window.innerWidth;
    my = 1.0 - e.clientY / window.innerHeight;
  });

  let startTime = performance.now();

  function draw() {
    const t = (performance.now() - startTime) / 1000.0;
    smx += (mx - smx) * 0.08;
    smy += (my - smy) * 0.08;
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform2f(uMouse, smx, smy);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
