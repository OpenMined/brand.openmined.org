<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - V5 Var3: Radial Gradients, 12 Layers, Bright Saturated</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(15px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

function sCurveY(x, w, h) {
  const t = x / w;
  return h * 0.5 + h * (-0.18 * Math.sin(Math.PI * t) + 0.04 * Math.sin(2 * Math.PI * t));
}

// Variation 3: Radial gradients for dimensional depth, 12 waves, bright saturated colors
// No RGB channel value below 100 for mid-tones
const waveDefs = [
  {
    // Top warm: vibrant orange-red
    colorLeft: [237, 105, 55],
    colorRight: [55, 190, 180],
    offsetY: -0.08, amplitude: 12, phase: 0, speed: 0.40, opacity: 0.72, thickness: 0.20
  },
  {
    colorLeft: [240, 120, 60],
    colorRight: [60, 185, 170],
    offsetY: -0.06, amplitude: 10, phase: 0.52, speed: 0.36, opacity: 0.68, thickness: 0.18
  },
  {
    colorLeft: [245, 160, 65],
    colorRight: [100, 200, 165],
    offsetY: -0.04, amplitude: 14, phase: 1.04, speed: 0.32, opacity: 0.75, thickness: 0.22
  },
  {
    colorLeft: [248, 195, 75],
    colorRight: [120, 210, 150],
    offsetY: -0.02, amplitude: 9, phase: 1.56, speed: 0.44, opacity: 0.65, thickness: 0.19
  },
  {
    colorLeft: [250, 185, 140],
    colorRight: [150, 215, 195],
    offsetY: 0.0, amplitude: 15, phase: 2.08, speed: 0.30, opacity: 0.70, thickness: 0.24
  },
  {
    colorLeft: [245, 170, 55],
    colorRight: [65, 175, 135],
    offsetY: 0.01, amplitude: 11, phase: 2.60, speed: 0.38, opacity: 0.62, thickness: 0.17
  },
  {
    colorLeft: [215, 110, 130],
    colorRight: [110, 200, 175],
    offsetY: 0.025, amplitude: 13, phase: 3.12, speed: 0.35, opacity: 0.67, thickness: 0.21
  },
  {
    colorLeft: [210, 75, 120],
    colorRight: [155, 215, 190],
    offsetY: 0.04, amplitude: 8, phase: 3.64, speed: 0.42, opacity: 0.58, thickness: 0.16
  },
  {
    colorLeft: [220, 100, 135],
    colorRight: [65, 180, 140],
    offsetY: 0.055, amplitude: 10, phase: 4.16, speed: 0.33, opacity: 0.60, thickness: 0.18
  },
  {
    colorLeft: [200, 60, 120],
    colorRight: [175, 215, 105],
    offsetY: 0.07, amplitude: 12, phase: 4.68, speed: 0.37, opacity: 0.55, thickness: 0.17
  },
  {
    colorLeft: [248, 200, 110],
    colorRight: [120, 210, 170],
    offsetY: -0.01, amplitude: 16, phase: 5.20, speed: 0.28, opacity: 0.50, thickness: 0.20
  },
  {
    colorLeft: [240, 140, 100],
    colorRight: [180, 215, 115],
    offsetY: 0.085, amplitude: 7, phase: 5.72, speed: 0.40, opacity: 0.45, thickness: 0.15
  }
];

function drawWave(wave, time) {
  const w = W();
  const h = H();
  const halfThick = wave.thickness * h * 0.5;

  const ph = wave.phase + time * wave.speed;
  const amp = wave.amplitude;

  const steps = 80;
  const dx = w / steps;

  // Build path points
  const topPts = [];
  const botPts = [];
  for (let i = 0; i <= steps; i++) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    const localThick = halfThick * (1.0 - 0.45 * t);
    topPts.push({ x: x, y: baseY + waveY - localThick });
    botPts.push({ x: x, y: baseY + waveY + localThick });
  }

  // Calculate center and extent for radial gradient
  const centerIdx = Math.floor(steps * 0.4);
  const cx = topPts[centerIdx].x;
  const cy = (topPts[centerIdx].y + botPts[centerIdx].y) * 0.5;
  const radius = Math.max(w * 0.6, h * 0.5);

  // Build path
  ctx.beginPath();
  ctx.moveTo(topPts[0].x, topPts[0].y);
  for (let i = 1; i <= steps; i++) {
    ctx.lineTo(topPts[i].x, topPts[i].y);
  }
  for (let i = steps; i >= 0; i--) {
    ctx.lineTo(botPts[i].x, botPts[i].y);
  }
  ctx.closePath();

  // Create radial gradient centered on the stream
  const cL = wave.colorLeft;
  const cR = wave.colorRight;
  const grad = ctx.createRadialGradient(cx * 0.3, cy, halfThick * 0.5, cx, cy, radius);
  grad.addColorStop(0.0, 'rgba(' + cL[0] + ',' + cL[1] + ',' + cL[2] + ', 0.90)');
  grad.addColorStop(0.3, 'rgba(' +
    Math.round(cL[0] * 0.7 + cR[0] * 0.3) + ',' +
    Math.round(cL[1] * 0.7 + cR[1] * 0.3) + ',' +
    Math.round(cL[2] * 0.7 + cR[2] * 0.3) + ', 0.65)');
  grad.addColorStop(0.55, 'rgba(' +
    Math.round(cL[0] * 0.4 + cR[0] * 0.6) + ',' +
    Math.round(cL[1] * 0.4 + cR[1] * 0.6) + ',' +
    Math.round(cL[2] * 0.4 + cR[2] * 0.6) + ', 0.50)');
  grad.addColorStop(0.8, 'rgba(' + cR[0] + ',' + cR[1] + ',' + cR[2] + ', 0.60)');
  grad.addColorStop(1.0, 'rgba(' + cR[0] + ',' + cR[1] + ',' + cR[2] + ', 0.20)');

  ctx.globalAlpha = wave.opacity;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function frame(ts) {
  const time = ts * 0.001;
  const w = W();
  const h = H();

  ctx.clearRect(0, 0, w, h);

  waveDefs.forEach(function(wave) { drawWave(wave, time); });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
