<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - Gradient Waves</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(18px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

/* ---- S-curve path function ---- */
function sCurveY(x, w, h) {
  const t = x / w;
  return h * 0.5 + h * (-0.18 * Math.sin(Math.PI * t) + 0.04 * Math.sin(2 * Math.PI * t));
}

/* ---- Wave layer definitions ---- */
const waveDefs = [
  /* Top warm layers - reds/oranges */
  {
    stops: [
      [0.0, 'rgba(237, 97, 46, 0.85)'],
      [0.35, 'rgba(245, 166, 53, 0.75)'],
      [0.55, 'rgba(130, 88, 160, 0.30)'],
      [0.75, 'rgba(50, 185, 175, 0.70)'],
      [1.0, 'rgba(50, 185, 175, 0.20)']
    ],
    offsetY: -0.06, amplitude: 12, phase: 0, speed: 0.4, opacity: 0.7, thickness: 0.18
  },
  {
    stops: [
      [0.0, 'rgba(237, 97, 46, 0.90)'],
      [0.30, 'rgba(237, 97, 46, 0.80)'],
      [0.50, 'rgba(200, 55, 115, 0.35)'],
      [0.70, 'rgba(50, 185, 175, 0.60)'],
      [1.0, 'rgba(65, 172, 130, 0.25)']
    ],
    offsetY: -0.035, amplitude: 10, phase: 0.8, speed: 0.35, opacity: 0.65, thickness: 0.16
  },
  /* Middle warm layers - golds/yellows */
  {
    stops: [
      [0.0, 'rgba(245, 166, 53, 0.90)'],
      [0.30, 'rgba(248, 205, 70, 0.85)'],
      [0.50, 'rgba(248, 205, 70, 0.40)'],
      [0.72, 'rgba(65, 172, 130, 0.65)'],
      [1.0, 'rgba(175, 210, 80, 0.30)']
    ],
    offsetY: 0.0, amplitude: 14, phase: 1.6, speed: 0.30, opacity: 0.75, thickness: 0.20
  },
  {
    stops: [
      [0.0, 'rgba(248, 205, 70, 0.80)'],
      [0.25, 'rgba(245, 166, 53, 0.75)'],
      [0.50, 'rgba(130, 88, 160, 0.30)'],
      [0.70, 'rgba(50, 185, 175, 0.55)'],
      [1.0, 'rgba(175, 210, 80, 0.25)']
    ],
    offsetY: 0.015, amplitude: 8, phase: 2.4, speed: 0.45, opacity: 0.60, thickness: 0.15
  },
  /* Bottom warm layers - magentas/pinks */
  {
    stops: [
      [0.0, 'rgba(200, 55, 115, 0.85)'],
      [0.30, 'rgba(200, 55, 115, 0.70)'],
      [0.50, 'rgba(130, 88, 160, 0.40)'],
      [0.75, 'rgba(65, 172, 130, 0.55)'],
      [1.0, 'rgba(175, 210, 80, 0.20)']
    ],
    offsetY: 0.045, amplitude: 11, phase: 3.2, speed: 0.38, opacity: 0.65, thickness: 0.17
  },
  {
    stops: [
      [0.0, 'rgba(200, 55, 115, 0.70)'],
      [0.25, 'rgba(130, 88, 160, 0.65)'],
      [0.50, 'rgba(130, 88, 160, 0.35)'],
      [0.72, 'rgba(50, 185, 175, 0.50)'],
      [1.0, 'rgba(65, 172, 130, 0.15)']
    ],
    offsetY: 0.065, amplitude: 9, phase: 4.0, speed: 0.32, opacity: 0.55, thickness: 0.14
  },
  /* Cool accent layers */
  {
    stops: [
      [0.0, 'rgba(245, 166, 53, 0.30)'],
      [0.40, 'rgba(130, 88, 160, 0.25)'],
      [0.60, 'rgba(50, 185, 175, 0.75)'],
      [0.80, 'rgba(50, 185, 175, 0.65)'],
      [1.0, 'rgba(65, 172, 130, 0.35)']
    ],
    offsetY: -0.025, amplitude: 13, phase: 4.8, speed: 0.28, opacity: 0.50, thickness: 0.13
  },
  {
    stops: [
      [0.0, 'rgba(248, 205, 70, 0.25)'],
      [0.35, 'rgba(130, 88, 160, 0.20)'],
      [0.55, 'rgba(65, 172, 130, 0.60)'],
      [0.80, 'rgba(175, 210, 80, 0.70)'],
      [1.0, 'rgba(175, 210, 80, 0.30)']
    ],
    offsetY: 0.03, amplitude: 10, phase: 5.6, speed: 0.42, opacity: 0.45, thickness: 0.12
  }
];

function drawWave(wave, time) {
  const w = W();
  const h = H();
  const halfThick = wave.thickness * h * 0.5;

  const ph = wave.phase + time * wave.speed;
  const amp = wave.amplitude;

  const steps = 80;
  const dx = w / steps;

  ctx.beginPath();

  /* Top edge (left to right) */
  for (let i = 0; i <= steps; i++) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    const localThick = halfThick * (1.0 - 0.45 * t);
    const y = baseY + waveY - localThick;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  /* Bottom edge (right to left) */
  for (let i = steps; i >= 0; i--) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    const localThick = halfThick * (1.0 - 0.45 * t);
    const y = baseY + waveY + localThick;
    ctx.lineTo(x, y);
  }

  ctx.closePath();

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  wave.stops.forEach(function(s) { grad.addColorStop(s[0], s[1]); });

  ctx.globalAlpha = wave.opacity;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function frame(ts) {
  const time = ts * 0.001;
  const w = W();
  const h = H();

  ctx.clearRect(0, 0, w, h);

  waveDefs.forEach(function(wave) { drawWave(wave, time); });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
