<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream v1 - Bezier Blobs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(6px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Cubic bezier S-curve control points (normalized 0-1)
  const curvePoints = [
    { x: -0.05, y: 0.25 },  // start upper-left
    { x: 0.30, y: 0.75 },   // pull down
    { x: 0.70, y: 0.20 },   // pull up
    { x: 1.05, y: 0.30 },   // end upper-right
  ];

  function bezier(t, p0, p1, p2, p3) {
    const u = 1 - t;
    return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
  }

  function getCurvePoint(t) {
    return {
      x: bezier(t, curvePoints[0].x, curvePoints[1].x, curvePoints[2].x, curvePoints[3].x),
      y: bezier(t, curvePoints[0].y, curvePoints[1].y, curvePoints[2].y, curvePoints[3].y),
    };
  }

  // Get tangent for perpendicular offset
  function getCurveTangent(t) {
    const dt = 0.001;
    const a = getCurvePoint(Math.max(0, t - dt));
    const b = getCurvePoint(Math.min(1, t + dt));
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    return { tx: dx/len, ty: dy/len, nx: -dy/len, ny: dx/len };
  }

  // Color palette: warm (left) to cool (right)
  // Each entry: [r, g, b] — we pick based on t along curve and offset
  const warmColors = [
    [230, 60, 30],    // red-orange top
    [245, 170, 30],   // gold middle
    [200, 40, 120],   // magenta bottom
  ];
  const coolColors = [
    [0, 160, 160],    // teal top
    [30, 170, 80],    // green middle
    [140, 200, 40],   // lime bottom
  ];

  function lerpColor(a, b, t) {
    return [
      a[0] + (b[0] - a[0]) * t,
      a[1] + (b[1] - a[1]) * t,
      a[2] + (b[2] - a[2]) * t,
    ];
  }

  function getColor(t, verticalOffset) {
    // verticalOffset: -1 (top) to +1 (bottom)
    // Map vertical offset to color index (0=top, 1=mid, 2=bottom)
    const vi = (verticalOffset + 1) * 0.5; // 0..1
    let warm, cool;
    if (vi < 0.5) {
      warm = lerpColor(warmColors[0], warmColors[1], vi * 2);
      cool = lerpColor(coolColors[0], coolColors[1], vi * 2);
    } else {
      warm = lerpColor(warmColors[1], warmColors[2], (vi - 0.5) * 2);
      cool = lerpColor(coolColors[1], coolColors[2], (vi - 0.5) * 2);
    }
    return lerpColor(warm, cool, t);
  }

  // Create blobs
  const NUM_BLOBS = 35;
  const blobs = [];
  for (let i = 0; i < NUM_BLOBS; i++) {
    const t = i / (NUM_BLOBS - 1);
    blobs.push({
      baseT: t,
      t: t,
      perpOffset: (Math.random() - 0.5) * 1.6, // -0.8..0.8
      basePerpOffset: (Math.random() - 0.5) * 1.6,
      phaseT: Math.random() * Math.PI * 2,
      phasePerp: Math.random() * Math.PI * 2,
      speedT: 0.05 + Math.random() * 0.08,
      speedPerp: 0.1 + Math.random() * 0.15,
      ampT: 0.01 + Math.random() * 0.015,
      ampPerp: 0.06 + Math.random() * 0.08,
    });
  }

  function getStreamWidth(t) {
    // Wider on left, narrower in center (~t=0.45), medium on right
    const center = 0.45;
    const squeeze = 1 - 0.55 * Math.exp(-((t - center) * (t - center)) / 0.04);
    const taper = 1 - 0.3 * t; // slightly thinner on right
    return squeeze * taper;
  }

  let time = 0;

  function draw() {
    time += 0.008;
    ctx.clearRect(0, 0, W, H);

    for (const blob of blobs) {
      // Animate t and perpendicular offset
      const animT = blob.baseT + Math.sin(time * blob.speedT + blob.phaseT) * blob.ampT;
      const animPerp = blob.basePerpOffset + Math.sin(time * blob.speedPerp + blob.phasePerp) * blob.ampPerp;

      const clampedT = Math.max(0, Math.min(1, animT));
      const pt = getCurvePoint(clampedT);
      const tang = getCurveTangent(clampedT);

      const streamW = getStreamWidth(clampedT);
      const perpDist = animPerp * streamW * 0.18 * H;

      const px = pt.x * W + tang.nx * perpDist;
      const py = pt.y * H + tang.ny * perpDist;

      // Radius: larger on left, smaller on right, also affected by stream width
      const baseRadius = H * 0.10;
      const radiusMult = (1.2 - 0.5 * clampedT) * streamW;
      const radius = baseRadius * radiusMult * (0.7 + 0.3 * Math.abs(animPerp));

      // Color
      const normalizedPerp = Math.max(-1, Math.min(1, animPerp));
      const col = getColor(clampedT, normalizedPerp);

      // Alpha: slightly lower for edge blobs
      const distFromCenter = Math.abs(animPerp);
      const alpha = 0.45 * (1 - distFromCenter * 0.4);

      // Draw radial gradient blob
      const grad = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, radius));
      grad.addColorStop(0, `rgba(${col[0]|0},${col[1]|0},${col[2]|0},${alpha})`);
      grad.addColorStop(0.4, `rgba(${col[0]|0},${col[1]|0},${col[2]|0},${alpha * 0.6})`);
      grad.addColorStop(1, `rgba(${col[0]|0},${col[1]|0},${col[2]|0},0)`);

      ctx.beginPath();
      ctx.arc(px, py, Math.max(1, radius), 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
