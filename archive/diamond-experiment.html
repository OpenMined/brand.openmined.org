<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMined — The Missing Layer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --grayscale-50: #fcfcfd;
      --grayscale-850: #272532;
      --grayscale-750: #353243;
      /* Diamond geometry */
      --outline-side: 340px;
      --outline-half: 170px;             /* side / 2 */
      --outline-tip: 240px;              /* side * √2 / 2 — distance from center to tip */
      --diamond-offset: 120px;           /* how far each outline center is from midpoint */
      --mesh-side: 390px;
      --mesh-half: 195px;
      --small-side: 140px;
      --small-half: 70px;
    }

    html {
      background: var(--grayscale-50);
      color: var(--grayscale-850);
      overflow: hidden;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
      Zero-dimension anchor at the exact center of the viewport.
      Everything is positioned relative to this point.
    */
    .origin {
      position: relative;
      width: 0;
      height: 0;
    }

    /* Parallax group — wraps all diamond elements */
    .diamond-group {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* --- Wireframe outlines --- */
    .diamond-outline {
      position: absolute;
      width: var(--outline-side);
      height: var(--outline-side);
      border: 1.2px solid var(--grayscale-850);
      /* translate centers the element on its anchor point, then rotate makes the diamond */
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .diamond-outline--left {
      left: calc(-1 * var(--diamond-offset));
      top: 0;
      z-index: 0;
    }

    .diamond-outline--right {
      left: var(--diamond-offset);
      top: 0;
      z-index: 10;
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    /* --- Gradient mesh --- */
    .diamond-mesh {
      position: absolute;
      z-index: 5;
    }

    .diamond-mesh--large {
      width: var(--mesh-side);
      height: var(--mesh-side);
      left: 0;
      top: 0;
      transform: translate(-50%, -50%) rotate(45deg);
      filter: blur(3px);
    }

    .diamond-mesh--small {
      width: var(--small-side);
      height: var(--small-side);
      left: 0;
      /* Position so its top corner aligns with the large mesh's top corner.
         Large top corner = -mesh-half * √2 = -195 * 1.414 = -275.8px from center.
         Small top corner = center_y - small-half * √2 = center_y - 99px.
         So center_y = -275.8 + 99 = -176.8px */
      top: -177px;
      transform: translate(-50%, -50%) rotate(-135deg);
      filter: blur(4px);
      opacity: 0.7;
    }

    .diamond-mesh canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* --- Labels --- */
    /* Positioned outside the diamond tips with a gap.
       Left tip  = -diamond-offset - outline-tip = -120 - 240 = -360px
       Right tip = +diamond-offset + outline-tip = +120 + 240 = +360px
       Add 12px gap so text never intersects the outline. */
    .label {
      position: absolute;
      font-family: "Sometype Mono", monospace;
      font-weight: 500;
      font-size: 14px;
      line-height: 18px;
      color: var(--grayscale-750);
      white-space: nowrap;
      top: 0;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity 1s ease, transform 1s ease;
      z-index: 11;
    }

    .label--left {
      left: -335px;   /* 25px inside left tip (-360) */
      transform: translateY(-50%) translateX(-12px);
    }

    .label--right {
      right: -335px;  /* right edge 25px inside right tip (360) */
      text-align: right;
      transform: translateY(-50%) translateX(12px);
    }

    .label.visible { opacity: 1; }
    .label--left.visible { transform: translateY(-50%) translateX(0); }
    .label--right.visible { transform: translateY(-50%) translateX(0); }

    /* --- Responsive --- */
    @media (max-width: 900px) {
      :root {
        --outline-side: 240px;
        --outline-half: 120px;
        --outline-tip: 170px;
        --diamond-offset: 85px;
        --mesh-side: 275px;
        --mesh-half: 137px;
        --small-side: 100px;
        --small-half: 50px;
      }

      .diamond-mesh--small {
        top: -124px;
      }

      .label { font-size: 12px; }
      .label--left { left: -230px; }
      .label--right { right: -230px; }
    }

    @media (max-width: 600px) {
      :root {
        --outline-side: 170px;
        --outline-half: 85px;
        --outline-tip: 120px;
        --diamond-offset: 60px;
        --mesh-side: 195px;
        --mesh-half: 97px;
        --small-side: 70px;
        --small-half: 35px;
      }

      .diamond-mesh--small {
        top: -88px;
      }

      /* Tips at ±180px. Place labels 25px inside = ±155px */
      .label { font-size: 10px; }
      .label--left { left: -155px; }
      .label--right { right: -155px; }
    }
  </style>
</head>
<body>

  <div class="origin">
    <div class="diamond-group" id="diamondGroup">
      <div class="diamond-outline diamond-outline--left"></div>
      <div class="diamond-outline diamond-outline--right"></div>

      <div class="diamond-mesh diamond-mesh--large" id="meshLarge">
        <canvas id="gradientLarge" width="780" height="780"></canvas>
      </div>

    </div>

    <span class="label label--left" id="labelLeft">Non-Public Data</span>
    <span class="label label--right" id="labelRight">Attributable Insights</span>
  </div>

  <script>
    (function () {
      "use strict";

      var MESH_BLOBS = [
        // LEFT — warm golds & oranges
        { r: 250, g: 178, b: 75,  ax: 0.15, ay: 0.35 },
        { r: 250, g: 178, b: 75,  ax: 0.25, ay: 0.55 },
        { r: 246, g: 125, b: 58,  ax: 0.20, ay: 0.45 },
        { r: 246, g: 125, b: 58,  ax: 0.10, ay: 0.60 },
        // CENTER-LEFT — reds
        { r: 195, g: 75,  b: 98,  ax: 0.38, ay: 0.35 },
        { r: 195, g: 75,  b: 98,  ax: 0.32, ay: 0.60 },
        { r: 195, g: 75,  b: 98,  ax: 0.45, ay: 0.75 },
        // CENTER — violet & blue
        { r: 130, g: 88,  b: 140, ax: 0.45, ay: 0.20 },
        { r: 130, g: 88,  b: 140, ax: 0.50, ay: 0.85 },
        { r: 88,  g: 100, b: 164, ax: 0.48, ay: 0.30 },
        // RIGHT — teals & greens
        { r: 62,  g: 150, b: 186, ax: 0.65, ay: 0.30 },
        { r: 62,  g: 150, b: 186, ax: 0.75, ay: 0.50 },
        { r: 65,  g: 172, b: 150, ax: 0.70, ay: 0.65 },
        { r: 65,  g: 172, b: 150, ax: 0.85, ay: 0.45 },
        { r: 120, g: 200, b: 118, ax: 0.80, ay: 0.60 },
        // EDGE accents
        { r: 240, g: 200, b: 95,  ax: 0.05, ay: 0.40 },
        { r: 240, g: 200, b: 95,  ax: 0.92, ay: 0.35 },
      ];

      var SMALL_BLOBS = [
        { r: 130, g: 88,  b: 140, ax: 0.35, ay: 0.30 },
        { r: 195, g: 75,  b: 98,  ax: 0.55, ay: 0.50 },
        { r: 246, g: 125, b: 58,  ax: 0.30, ay: 0.65 },
        { r: 62,  g: 150, b: 186, ax: 0.70, ay: 0.35 },
        { r: 250, g: 178, b: 75,  ax: 0.45, ay: 0.70 },
      ];

      function MeshBlob(size, cfg) {
        this.size = size;
        this.color = { r: cfg.r, g: cfg.g, b: cfg.b };
        this.anchorX = cfg.ax * size;
        this.anchorY = cfg.ay * size;
        this.x = this.anchorX;
        this.y = this.anchorY;
        this.radius = size * (0.28 + Math.random() * 0.18);
        this.phase = Math.random() * Math.PI * 2;
        this.phaseY = Math.random() * Math.PI * 2;
        this.speed = 0.0008 + Math.random() * 0.0012;
        this.drift = size * (0.03 + Math.random() * 0.05);
      }

      MeshBlob.prototype.update = function (t, mcx, mcy) {
        var baseX = this.anchorX + Math.sin(t * this.speed + this.phase) * this.drift;
        var baseY = this.anchorY + Math.cos(t * this.speed * 0.8 + this.phaseY) * this.drift;

        var targetX = baseX;
        var targetY = baseY;

        /* Repel from mouse */
        var dx = baseX - mcx;
        var dy = baseY - mcy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var repelRadius = 220;
        var repelStrength = 180;

        if (dist < repelRadius && dist > 0.1) {
          var f = (1 - dist / repelRadius);
          var force = f * f * repelStrength;
          targetX = baseX + (dx / dist) * force;
          targetY = baseY + (dy / dist) * force;
        }

        this.x += (targetX - this.x) * 0.1;
        this.y += (targetY - this.y) * 0.1;
      };

      MeshBlob.prototype.draw = function (ctx) {
        var c = this.color;
        var g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        g.addColorStop(0,    "rgba(" + c.r + "," + c.g + "," + c.b + ",1)");
        g.addColorStop(0.25, "rgba(" + c.r + "," + c.g + "," + c.b + ",0.8)");
        g.addColorStop(0.5,  "rgba(" + c.r + "," + c.g + "," + c.b + ",0.4)");
        g.addColorStop(0.8,  "rgba(" + c.r + "," + c.g + "," + c.b + ",0.1)");
        g.addColorStop(1,    "rgba(" + c.r + "," + c.g + "," + c.b + ",0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, this.size, this.size);
      };

      function initMesh(canvas, cfgs) {
        var ctx = canvas.getContext("2d");
        var s = canvas.width;
        var blobs = [];
        for (var i = 0; i < cfgs.length; i++) blobs.push(new MeshBlob(s, cfgs[i]));
        return { ctx: ctx, size: s, blobs: blobs };
      }

      var largeMesh = initMesh(document.getElementById("gradientLarge"), MESH_BLOBS);

      function renderMesh(m, t, mcx, mcy) {
        m.ctx.clearRect(0, 0, m.size, m.size);
        for (var i = 0; i < m.blobs.length; i++) {
          m.blobs[i].update(t, mcx, mcy);
          m.blobs[i].draw(m.ctx);
        }
      }

      /* --- Mouse tracking --- */
      var tRX = 0, tRY = 0, cRX = 0, cRY = 0;
      var mouseCanvasX = -9999, mouseCanvasY = -9999;
      var COS45 = Math.cos(Math.PI / 4);

      document.addEventListener("mousemove", function (e) {
        var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        tRX = ((e.clientY - cy) / cy) * 5;
        tRY = ((e.clientX - cx) / cx) * 5;

        /* Map mouse to canvas coordinates (unrotate 45deg, scale to 780px) */
        var relX = e.clientX - cx;
        var relY = e.clientY - cy;
        var localX = relX * COS45 + relY * COS45;
        var localY = -relX * COS45 + relY * COS45;
        var meshCSS = document.getElementById("meshLarge").offsetWidth || 390;
        mouseCanvasX = (localX / meshCSS + 0.5) * 780;
        mouseCanvasY = (localY / meshCSS + 0.5) * 780;
      });

      document.addEventListener("mouseleave", function () {
        mouseCanvasX = -9999;
        mouseCanvasY = -9999;
      });

      var dGroup = document.getElementById("diamondGroup");
      var mLg = document.getElementById("meshLarge");

      /* --- Labels --- */
      setTimeout(function () { document.getElementById("labelLeft").classList.add("visible"); }, 500);
      setTimeout(function () { document.getElementById("labelRight").classList.add("visible"); }, 800);

      /* --- Loop --- */
      var t0 = performance.now();

      function loop(ts) {
        var t = ts - t0;

        renderMesh(largeMesh, t, mouseCanvasX, mouseCanvasY);

        cRX += (tRX - cRX) * 0.03;
        cRY += (tRY - cRY) * 0.03;

        var breathe = Math.sin(t * 0.0007) * 1;
        var scale = 1 + Math.sin(t * 0.0005) * 0.008;

        dGroup.style.transform =
          "perspective(1000px) rotateX(" + (cRX + breathe * 0.15) +
          "deg) rotateY(" + cRY + "deg) scale(" + scale + ")";

        // Parallax offset for meshes — translate BEFORE the rotate
        // so movement stays on screen axes
        var ox = cRY * 1;
        var oy = cRX * 1;
        mLg.style.transform =
          "translate(calc(-50% + " + ox + "px), calc(-50% + " + oy + "px)) rotate(45deg)";

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
