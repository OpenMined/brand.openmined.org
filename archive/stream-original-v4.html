<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMined — Stream (V4: Dramatic S-Curve, Diffuse Gaseous)</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <script id="vert" type="x-shader/x-vertex">
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  </script>

  <script id="frag" type="x-shader/x-fragment">
    precision highp float;
    uniform float uTime;
    uniform vec2  uRes;

    vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }

    float snoise(vec2 v){
      const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                         -0.577350269189626, 0.024390243902439);
      vec2 i = floor(v + dot(v, C.yy));
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod289(i);
      vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                               + i.x + vec3(0.0, i1.x, 1.0));
      vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
                               dot(x12.zw,x12.zw)), 0.0);
      m = m*m; m = m*m;
      vec3 x = 2.0*fract(p*C.www) - 1.0;
      vec3 h = abs(x) - 0.5;
      vec3 ox = floor(x + 0.5);
      vec3 a0 = x - ox;
      m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
      vec3 g;
      g.x  = a0.x*x0.x  + h.x*x0.y;
      g.yz = a0.yz*x12.xz + h.yz*x12.yw;
      return 130.0 * dot(m, g);
    }

    // More dramatic S-curve with increased amplitude and more noise
    float streamPath(float x, float offset, float t) {
      float base = -0.22 * sin(x * 3.14159);  // boosted from 0.15 to 0.22
      // More noise layers for organic feel
      float wave = 0.08 * snoise(vec2(x * 2.0 - t * 0.15, offset + t * 0.04))
                 + 0.04 * snoise(vec2(x * 4.0 - t * 0.22, offset * 3.0 + t * 0.03))
                 + 0.02 * snoise(vec2(x * 7.0 - t * 0.10, offset * 5.0 + t * 0.05));
      return base + wave + offset;
    }

    float ribbon(vec2 uv, float pathOffset, float sigma, float t) {
      float center = streamPath(uv.x, pathOffset, t);
      float dist = uv.y - center;
      // More width variation for organic breathing
      float s = sigma + 0.02 * snoise(vec2(uv.x * 3.0 - t * 0.10, pathOffset * 5.0))
                      + 0.01 * snoise(vec2(uv.x * 6.0 + t * 0.08, pathOffset * 8.0));
      return exp(-dist * dist / (2.0 * s * s));
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / uRes;
      float aspect = uRes.x / uRes.y;
      vec2 st = vec2(uv.x, (uv.y - 0.5) / aspect * 2.0);
      float t = uTime;

      vec3 col = vec3(1.0);

      // Wide bands (sigma 0.08-0.12), lower alpha (0.5-0.7) for diffuse gaseous look
      // Bright saturated colors throughout

      // Band 1: Top — vivid red-orange -> warm coral -> bright cyan
      {
        float a = ribbon(st, -0.10, 0.10, t) * 0.65;
        vec3 cLeft  = vec3(0.95, 0.35, 0.15);
        vec3 cMid   = vec3(0.95, 0.60, 0.45);  // coral
        vec3 cRight = vec3(0.20, 0.75, 0.70);
        float xm = uv.x + 0.06 * snoise(vec2(uv.x * 2.5 - t * 0.07, 1.0));
        vec3 c = xm < 0.4
          ? mix(cLeft, cMid, smoothstep(0.0, 0.4, xm))
          : mix(cMid, cRight, smoothstep(0.4, 1.0, xm));
        col = mix(col, c, a);
      }

      // Band 2: Upper-mid — bright amber -> peach -> soft teal
      {
        float a = ribbon(st, -0.03, 0.09, t) * 0.60;
        vec3 cLeft  = vec3(0.96, 0.72, 0.22);
        vec3 cMid   = vec3(0.92, 0.65, 0.52);  // peach
        vec3 cRight = vec3(0.30, 0.70, 0.65);
        float xm = uv.x + 0.05 * snoise(vec2(uv.x * 2.0 - t * 0.06, 3.0));
        vec3 c = xm < 0.45
          ? mix(cLeft, cMid, smoothstep(0.05, 0.45, xm))
          : mix(cMid, cRight, smoothstep(0.45, 0.90, xm));
        col = mix(col, c, a);
      }

      // Band 3: Center — warm gold -> light lavender -> aqua
      {
        float a = ribbon(st, 0.02, 0.12, t) * 0.55;
        vec3 cLeft  = vec3(0.97, 0.82, 0.35);
        vec3 cMid   = vec3(0.80, 0.60, 0.72);  // light lavender
        vec3 cRight = vec3(0.35, 0.68, 0.60);
        float xm = uv.x + 0.04 * snoise(vec2(uv.x * 3.0 - t * 0.08, 5.5));
        vec3 c = xm < 0.5
          ? mix(cLeft, cMid, smoothstep(0.05, 0.5, xm))
          : mix(cMid, cRight, smoothstep(0.5, 0.95, xm));
        col = mix(col, c, a);
      }

      // Band 4: Lower-mid — hot magenta -> soft rose -> emerald
      {
        float a = ribbon(st, 0.08, 0.10, t) * 0.60;
        vec3 cLeft  = vec3(0.85, 0.25, 0.48);
        vec3 cMid   = vec3(0.75, 0.50, 0.60);  // soft rose
        vec3 cRight = vec3(0.25, 0.68, 0.48);
        float xm = uv.x + 0.05 * snoise(vec2(uv.x * 2.0 - t * 0.07, 7.0));
        vec3 c = xm < 0.45
          ? mix(cLeft, cMid, smoothstep(0.0, 0.45, xm))
          : mix(cMid, cRight, smoothstep(0.45, 1.0, xm));
        col = mix(col, c, a);
      }

      // Band 5: Bottom — deep pink -> warm sage -> bright lime
      {
        float a = ribbon(st, 0.14, 0.08, t) * 0.50;
        vec3 cLeft  = vec3(0.72, 0.15, 0.40);
        vec3 cMid   = vec3(0.58, 0.55, 0.48);  // warm sage
        vec3 cRight = vec3(0.55, 0.82, 0.30);
        float xm = uv.x + 0.04 * snoise(vec2(uv.x * 2.5 - t * 0.06, 9.0));
        vec3 c = xm < 0.5
          ? mix(cLeft, cMid, smoothstep(0.0, 0.5, xm))
          : mix(cMid, cRight, smoothstep(0.5, 1.0, xm));
        col = mix(col, c, a);
      }

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <canvas id="c"></canvas>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("c");
      var gl = canvas.getContext("webgl", { alpha: false });

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width  = window.innerWidth  * dpr;
        canvas.height = window.innerHeight * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);
      }

      function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          console.error(gl.getShaderInfoLog(s));
        return s;
      }

      var vs = compile(gl.VERTEX_SHADER, document.getElementById("vert").textContent);
      var fs = compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent);

      var prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      var uTime = gl.getUniformLocation(prog, "uTime");
      var uRes  = gl.getUniformLocation(prog, "uRes");

      resize();
      window.addEventListener("resize", resize);

      var t0 = performance.now();

      function loop(ts) {
        gl.uniform1f(uTime, (ts - t0) / 1000.0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
