<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - Metaballs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(10px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

/* ---- S-curve ---- */
function sCurveY(t) {
  return 0.5 + (-0.20 * Math.sin(Math.PI * t) + 0.05 * Math.sin(2 * Math.PI * t));
}

/* ---- Color palette ---- */
const colors = {
  redOrange: [237, 97, 46],
  orange:    [245, 166, 53],
  gold:      [248, 205, 70],
  magenta:   [200, 55, 115],
  violet:    [130, 88, 160],
  teal:      [50, 185, 175],
  green:     [65, 172, 130],
  lime:      [175, 210, 80]
};

function lerpColor(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}

function smoothstep(edge0, edge1, x) {
  var t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function pickColor(xt, vOff) {
  var vn = vOff * 0.5 + 0.5;
  var warm, cool;
  if (vn < 0.35) {
    warm = lerpColor(colors.redOrange, colors.orange, vn / 0.35);
    cool = lerpColor(colors.teal, colors.green, vn / 0.35);
  } else if (vn < 0.65) {
    var lt = (vn - 0.35) / 0.30;
    warm = lerpColor(colors.orange, colors.gold, lt);
    cool = lerpColor(colors.green, colors.lime, lt);
  } else {
    var lt = (vn - 0.65) / 0.35;
    warm = lerpColor(colors.magenta, colors.violet, lt);
    cool = lerpColor(colors.lime, colors.green, lt);
  }
  var blend = smoothstep(0.3, 0.7, xt);
  return lerpColor(warm, cool, blend);
}

/* ---- Generate metaballs ---- */
var balls = [];
var BALL_COUNT = 42;

for (var i = 0; i < BALL_COUNT; i++) {
  var xt = Math.pow(i / (BALL_COUNT - 1), 0.85);
  var curveY = sCurveY(xt);
  var spread = 0.18 * (1 - xt * 0.55);
  var vOff = (Math.random() * 2 - 1);
  var yOff = vOff * spread;
  var baseSize = 0.06 + 0.10 * (1 - xt * 0.7);
  var size = baseSize * (0.6 + Math.random() * 0.8);
  var orbitRadius = (0.008 + Math.random() * 0.018) * (1 - xt * 0.4);
  var orbitSpeed = 0.2 + Math.random() * 0.5;
  var orbitPhase = Math.random() * Math.PI * 2;
  var driftAmpX = 0.003 + Math.random() * 0.008;
  var driftAmpY = 0.005 + Math.random() * 0.012;
  var driftSpeed = 0.05 + Math.random() * 0.15;
  var driftPhase = Math.random() * Math.PI * 2;
  var color = pickColor(xt, vOff);
  var opacity = 0.35 + 0.40 * (1 - xt * 0.5) * (1 - Math.abs(vOff) * 0.3);

  balls.push({
    anchorX: xt,
    anchorY: curveY + yOff,
    size: size,
    color: color,
    opacity: opacity,
    orbitRadius: orbitRadius,
    orbitSpeed: orbitSpeed,
    orbitPhase: orbitPhase,
    driftAmpX: driftAmpX,
    driftAmpY: driftAmpY,
    driftSpeed: driftSpeed,
    driftPhase: driftPhase,
    vOff: vOff
  });
}

balls.sort(function(a, b) { return b.size - a.size; });

function drawBall(ball, time) {
  var w = W();
  var h = H();
  var dim = Math.min(w, h);

  var orbitX = ball.orbitRadius * Math.cos(time * ball.orbitSpeed + ball.orbitPhase);
  var orbitY = ball.orbitRadius * Math.sin(time * ball.orbitSpeed * 0.8 + ball.orbitPhase);
  var driftX = ball.driftAmpX * Math.sin(time * ball.driftSpeed + ball.driftPhase);
  var driftY = ball.driftAmpY * Math.cos(time * ball.driftSpeed * 0.7 + ball.driftPhase + 1.0);

  var cx = (ball.anchorX + orbitX + driftX) * w;
  var cy = (ball.anchorY + orbitY + driftY) * h;
  var r = ball.size * dim * 0.5;

  var cr = Math.round(ball.color[0]);
  var cg = Math.round(ball.color[1]);
  var cb = Math.round(ball.color[2]);

  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0.0, 'rgba(' + cr + ', ' + cg + ', ' + cb + ', ' + ball.opacity + ')');
  grad.addColorStop(0.3, 'rgba(' + cr + ', ' + cg + ', ' + cb + ', ' + (ball.opacity * 0.7) + ')');
  grad.addColorStop(0.6, 'rgba(' + cr + ', ' + cg + ', ' + cb + ', ' + (ball.opacity * 0.3) + ')');
  grad.addColorStop(1.0, 'rgba(' + cr + ', ' + cg + ', ' + cb + ', 0.0)');

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

/* ---- Data flow particles ---- */
var particles = [];
var PARTICLE_COUNT = 60;

for (var i = 0; i < PARTICLE_COUNT; i++) {
  particles.push({
    progress: Math.random(),
    speed: 0.015 + Math.random() * 0.03,
    vOff: (Math.random() * 2 - 1) * 0.08,
    size: 1.5 + Math.random() * 3,
    opacity: 0.15 + Math.random() * 0.25,
    phase: Math.random() * Math.PI * 2
  });
}

function drawParticles(time) {
  var w = W();
  var h = H();

  for (var pi = 0; pi < particles.length; pi++) {
    var p = particles[pi];
    p.progress += p.speed * 0.016;
    if (p.progress > 1.1) {
      p.progress = -0.1;
      p.vOff = (Math.random() * 2 - 1) * 0.08;
    }

    var xt = Math.max(0, Math.min(1, p.progress));
    var curveY = sCurveY(xt);
    var spread = 0.12 * (1 - xt * 0.5);
    var yWobble = p.vOff + 0.01 * Math.sin(time * 2 + p.phase);

    var cx = p.progress * w;
    var cy = (curveY + yWobble * spread) * h;

    var color = pickColor(xt, yWobble * 5);
    var cr = Math.round(color[0]);
    var cg = Math.round(color[1]);
    var cb = Math.round(color[2]);

    var alpha = p.opacity;
    if (p.progress < 0.05) alpha *= p.progress / 0.05;
    if (p.progress > 0.95) alpha *= (1 - p.progress) / 0.05;

    ctx.beginPath();
    ctx.arc(cx, cy, p.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + cr + ', ' + cg + ', ' + cb + ', ' + alpha + ')';
    ctx.fill();
  }
}

function frame(ts) {
  var time = ts * 0.001;
  var w = W();
  var h = H();

  ctx.clearRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';

  for (var i = 0; i < balls.length; i++) {
    drawBall(balls[i], time);
  }

  drawParticles(time);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
