<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream V10 — Canvas Spline Trails</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(5px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); initTrails(); });
resize();

// Color palette
const colors = {
  redOrange: [237, 97, 46],
  orange:    [245, 166, 53],
  gold:      [248, 205, 70],
  magenta:   [200, 55, 115],
  violet:    [130, 88, 160],
  teal:      [50, 185, 175],
  green:     [65, 172, 130],
  lime:      [175, 210, 80]
};

// Interpolate between two RGB colors
function lerpColor(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}

// Get color at position (0-1 along x, -1 to 1 along y offset)
function getColor(xNorm, yOff) {
  const t = Math.max(0, Math.min(1, xNorm));
  let col;

  // 8-stop gradient along x
  const stops = [
    [0.0,   colors.redOrange],
    [0.14,  colors.orange],
    [0.28,  colors.gold],
    [0.38,  colors.magenta],
    [0.48,  colors.violet],
    [0.60,  colors.teal],
    [0.75,  colors.green],
    [1.0,   colors.lime]
  ];

  col = stops[stops.length - 1][1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i][0] && t <= stops[i + 1][0]) {
      const s = (t - stops[i][0]) / (stops[i + 1][0] - stops[i][0]);
      col = lerpColor(stops[i][1], stops[i + 1][1], s);
      break;
    }
  }

  // Shift color based on vertical offset
  const shift = Math.max(-1, Math.min(1, yOff));
  if (t < 0.5) {
    // Warm side: shift toward magenta (below) or gold (above)
    if (shift > 0) {
      col = lerpColor(col, colors.magenta, shift * 0.25);
    } else {
      col = lerpColor(col, colors.gold, -shift * 0.25);
    }
  } else {
    // Cool side: shift toward green (below) or teal (above)
    if (shift > 0) {
      col = lerpColor(col, colors.green, shift * 0.25);
    } else {
      col = lerpColor(col, colors.teal, -shift * 0.25);
    }
  }

  return col;
}

// S-curve center Y
function sCurveY(x) {
  const t = x / W;
  const phase = t * Math.PI;
  return H * (0.5 + 0.22 * Math.cos(phase) - 0.05 * Math.sin(phase * 2));
}

// Stream width
function streamWidth(x) {
  const t = x / W;
  const center = 0.5;
  const narrowing = 1.0 - 0.5 * Math.exp(-8 * (t - center) * (t - center));
  const leftThick = 0.22 * (1 - t) + 0.10 * t;
  return (leftThick * narrowing + 0.06) * H;
}

// Trail definition
class Trail {
  constructor(index, total) {
    this.index = index;
    // Bias trails toward left side (more density there)
    const xBias = Math.pow(Math.random(), 0.7); // sqrt bias toward 0
    this.xStart = -0.05;
    this.xEnd = 1.05;

    // Random vertical offset within stream (-1 to 1)
    this.yOffset = (Math.random() * 2 - 1) * 0.85;

    // Width: 1-15px, biased toward thinner
    this.lineWidth = 1 + Math.pow(Math.random(), 0.5) * 14;

    // Opacity: 0.02-0.15
    this.opacity = 0.02 + Math.random() * 0.13;

    // Trails on left are more opaque and wider
    if (Math.random() < 0.4) {
      // Left-biased trail
      this.xEnd = 0.4 + Math.random() * 0.65;
      this.opacity *= 1.3;
      this.lineWidth *= 1.2;
    }

    // Animation parameters
    this.phaseX = Math.random() * Math.PI * 2;
    this.phaseY = Math.random() * Math.PI * 2;
    this.freqX = 0.15 + Math.random() * 0.25;
    this.freqY = 0.1 + Math.random() * 0.2;
    this.ampX = 2 + Math.random() * 6;
    this.ampY = 3 + Math.random() * 12;

    // Per-control-point phase offsets for organic motion
    this.cpPhases = [];
    for (let i = 0; i < 8; i++) {
      this.cpPhases.push({
        px: Math.random() * Math.PI * 2,
        py: Math.random() * Math.PI * 2,
        fx: 0.08 + Math.random() * 0.2,
        fy: 0.06 + Math.random() * 0.18,
        ax: 1 + Math.random() * 5,
        ay: 2 + Math.random() * 10
      });
    }
  }

  // Get bezier control points at time t
  getPoints(time) {
    const steps = 7;
    const pts = [];

    for (let i = 0; i <= steps; i++) {
      const frac = i / steps;
      const xNorm = this.xStart + (this.xEnd - this.xStart) * frac;
      const x = xNorm * W;
      const cy = sCurveY(x);
      const sw = streamWidth(x);
      const baseY = cy + this.yOffset * sw * 0.5;

      // Animated offsets
      const cp = this.cpPhases[i] || this.cpPhases[0];
      const ox = Math.sin(time * cp.fx + cp.px) * cp.ax;
      const oy = Math.sin(time * cp.fy + cp.py) * cp.ay;

      // Global undulation
      const gox = Math.sin(time * this.freqX + this.phaseX + frac * 2) * this.ampX;
      const goy = Math.sin(time * this.freqY + this.phaseY + frac * 3) * this.ampY;

      pts.push([x + ox + gox, baseY + oy + goy]);
    }

    return pts;
  }

  draw(time) {
    const pts = this.getPoints(time);
    if (pts.length < 2) return;

    // Create gradient along the path
    const startX = pts[0][0];
    const endX = pts[pts.length - 1][0];
    const grad = ctx.createLinearGradient(startX, 0, endX, 0);

    // Sample colors along the path
    const numStops = 8;
    for (let i = 0; i <= numStops; i++) {
      const frac = i / numStops;
      const xNorm = this.xStart + (this.xEnd - this.xStart) * frac;
      const col = getColor(xNorm, this.yOffset);
      grad.addColorStop(frac, `rgba(${Math.round(col[0])},${Math.round(col[1])},${Math.round(col[2])},${this.opacity})`);
    }

    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);

    // Draw smooth curve through points using cardinal spline approach
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];

      const tension = 0.3;
      const cp1x = p1[0] + (p2[0] - p0[0]) * tension;
      const cp1y = p1[1] + (p2[1] - p0[1]) * tension;
      const cp2x = p2[0] - (p3[0] - p1[0]) * tension;
      const cp2y = p2[1] - (p3[1] - p1[1]) * tension;

      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2[0], p2[1]);
    }

    ctx.strokeStyle = grad;
    ctx.lineWidth = this.lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
}

// Create trails
let trails = [];
const TRAIL_COUNT = 220;

function initTrails() {
  trails = [];
  for (let i = 0; i < TRAIL_COUNT; i++) {
    trails.push(new Trail(i, TRAIL_COUNT));
  }
  // Sort by line width so thicker trails draw first (background)
  trails.sort((a, b) => b.lineWidth - a.lineWidth);
}
initTrails();

// Animation loop
let startTime = performance.now();

function frame() {
  const elapsed = (performance.now() - startTime) / 1000;

  // Clear to white
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // Draw all trails
  for (const trail of trails) {
    trail.draw(elapsed);
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
