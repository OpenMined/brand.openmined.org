<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMined — Stream (V5: Reference Color Match, 6 Bands)</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <script id="vert" type="x-shader/x-vertex">
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  </script>

  <script id="frag" type="x-shader/x-fragment">
    precision highp float;
    uniform float uTime;
    uniform vec2  uRes;

    vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }

    float snoise(vec2 v){
      const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                         -0.577350269189626, 0.024390243902439);
      vec2 i = floor(v + dot(v, C.yy));
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod289(i);
      vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                               + i.x + vec3(0.0, i1.x, 1.0));
      vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
                               dot(x12.zw,x12.zw)), 0.0);
      m = m*m; m = m*m;
      vec3 x = 2.0*fract(p*C.www) - 1.0;
      vec3 h = abs(x) - 0.5;
      vec3 ox = floor(x + 0.5);
      vec3 a0 = x - ox;
      m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
      vec3 g;
      g.x  = a0.x*x0.x  + h.x*x0.y;
      g.yz = a0.yz*x12.xz + h.yz*x12.yw;
      return 130.0 * dot(m, g);
    }

    float streamPath(float x, float offset, float t) {
      float base = -0.15 * sin(x * 3.14159);
      float wave = 0.06 * snoise(vec2(x * 2.0 - t * 0.12, offset + t * 0.03))
                 + 0.03 * snoise(vec2(x * 4.0 - t * 0.18, offset * 3.0 + t * 0.02));
      return base + wave + offset;
    }

    float ribbon(vec2 uv, float pathOffset, float sigma, float t) {
      float center = streamPath(uv.x, pathOffset, t);
      float dist = uv.y - center;
      float s = sigma + 0.015 * snoise(vec2(uv.x * 3.0 - t * 0.08, pathOffset * 5.0));
      return exp(-dist * dist / (2.0 * s * s));
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / uRes;
      float aspect = uRes.x / uRes.y;
      vec2 st = vec2(uv.x, (uv.y - 0.5) / aspect * 2.0);
      float t = uTime;

      vec3 col = vec3(1.0);

      // 6 bands with precise reference color palette
      // Left: vivid red-orange, golden amber, hot pink
      // Center: soft coral, warm lavender, light teal
      // Right: bright teal, emerald, lime

      // Band 1: Top — vivid red-orange -> soft coral -> bright teal
      {
        float a = ribbon(st, -0.10, 0.07, t) * 0.88;
        vec3 cLeft  = vec3(0.95, 0.30, 0.12);   // vivid red-orange
        vec3 cMid   = vec3(0.95, 0.55, 0.45);   // soft coral
        vec3 cRight = vec3(0.15, 0.75, 0.70);   // bright teal
        float xm = uv.x + 0.05 * snoise(vec2(uv.x * 2.5 - t * 0.06, 1.0));
        vec3 c = xm < 0.42
          ? mix(cLeft, cMid, smoothstep(0.0, 0.42, xm))
          : mix(cMid, cRight, smoothstep(0.42, 1.0, xm));
        col = mix(col, c, a);
      }

      // Band 2: Upper-mid — golden amber -> warm peach -> teal-green
      {
        float a = ribbon(st, -0.04, 0.065, t) * 0.85;
        vec3 cLeft  = vec3(0.96, 0.72, 0.18);   // golden amber
        vec3 cMid   = vec3(0.92, 0.62, 0.48);   // warm peach
        vec3 cRight = vec3(0.20, 0.72, 0.60);   // teal-green
        float xm = uv.x + 0.04 * snoise(vec2(uv.x * 2.0 - t * 0.05, 3.0));
        vec3 c = xm < 0.45
          ? mix(cLeft, cMid, smoothstep(0.05, 0.45, xm))
          : mix(cMid, cRight, smoothstep(0.45, 0.90, xm));
        col = mix(col, c, a);
      }

      // Band 3: Center-upper — warm yellow -> warm lavender -> aqua
      {
        float a = ribbon(st, 0.01, 0.06, t) * 0.80;
        vec3 cLeft  = vec3(0.97, 0.80, 0.30);   // warm yellow
        vec3 cMid   = vec3(0.75, 0.55, 0.75);   // warm lavender
        vec3 cRight = vec3(0.40, 0.75, 0.70);   // light teal
        float xm = uv.x + 0.03 * snoise(vec2(uv.x * 3.0 - t * 0.07, 5.0));
        vec3 c = xm < 0.48
          ? mix(cLeft, cMid, smoothstep(0.05, 0.48, xm))
          : mix(cMid, cRight, smoothstep(0.48, 0.95, xm));
        col = mix(col, c, a);
      }

      // Band 4: Center-lower — hot pink -> light mauve -> emerald
      {
        float a = ribbon(st, 0.06, 0.06, t) * 0.82;
        vec3 cLeft  = vec3(0.90, 0.20, 0.50);   // hot pink
        vec3 cMid   = vec3(0.72, 0.50, 0.62);   // light mauve
        vec3 cRight = vec3(0.20, 0.72, 0.45);   // emerald
        float xm = uv.x + 0.04 * snoise(vec2(uv.x * 2.0 - t * 0.06, 7.0));
        vec3 c = xm < 0.45
          ? mix(cLeft, cMid, smoothstep(0.0, 0.45, xm))
          : mix(cMid, cRight, smoothstep(0.45, 1.0, xm));
        col = mix(col, c, a);
      }

      // Band 5: Lower — magenta -> soft sage -> bright green
      {
        float a = ribbon(st, 0.10, 0.055, t) * 0.78;
        vec3 cLeft  = vec3(0.80, 0.18, 0.45);
        vec3 cMid   = vec3(0.60, 0.55, 0.52);   // soft sage
        vec3 cRight = vec3(0.30, 0.72, 0.38);
        float xm = uv.x + 0.03 * snoise(vec2(uv.x * 2.3 - t * 0.055, 8.5));
        vec3 c = xm < 0.48
          ? mix(cLeft, cMid, smoothstep(0.0, 0.48, xm))
          : mix(cMid, cRight, smoothstep(0.48, 1.0, xm));
        col = mix(col, c, a);
      }

      // Band 6: Bottom — deep rose -> light mint -> lime
      {
        float a = ribbon(st, 0.15, 0.05, t) * 0.68;
        vec3 cLeft  = vec3(0.70, 0.15, 0.40);
        vec3 cMid   = vec3(0.52, 0.60, 0.48);   // light mint
        vec3 cRight = vec3(0.55, 0.82, 0.28);   // lime
        float xm = uv.x + 0.03 * snoise(vec2(uv.x * 2.5 - t * 0.05, 10.0));
        vec3 c = xm < 0.5
          ? mix(cLeft, cMid, smoothstep(0.0, 0.5, xm))
          : mix(cMid, cRight, smoothstep(0.5, 1.0, xm));
        col = mix(col, c, a);
      }

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <canvas id="c"></canvas>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("c");
      var gl = canvas.getContext("webgl", { alpha: false });

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width  = window.innerWidth  * dpr;
        canvas.height = window.innerHeight * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);
      }

      function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          console.error(gl.getShaderInfoLog(s));
        return s;
      }

      var vs = compile(gl.VERTEX_SHADER, document.getElementById("vert").textContent);
      var fs = compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent);

      var prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      var uTime = gl.getUniformLocation(prog, "uTime");
      var uRes  = gl.getUniformLocation(prog, "uRes");

      resize();
      window.addEventListener("resize", resize);

      var t0 = performance.now();

      function loop(ts) {
        gl.uniform1f(uTime, (ts - t0) / 1000.0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
