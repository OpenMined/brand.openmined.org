<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream V9 Var3 — Dramatic S-Curve, 6 Color Zones</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false });

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const vsrc = `
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const fsrc = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;

vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0*fract(p*C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
  vec3 g; g.x = a0.x*x0.x + h.x*x0.y; g.yz = a0.yz*x12.xz + h.yz*x12.yw;
  return 130.0 * dot(m, g);
}

// Softer fbm: fewer effective octaves via faster amplitude decay, larger scale
float fbm(vec2 p, float t){
  float val = 0.0;
  float amp = 0.5;
  float freq = 0.8;
  for(int i = 0; i < 4; i++){
    val += amp * snoise(p * freq + t * 0.12 * float(i + 1));
    freq *= 1.9;
    amp *= 0.4;
  }
  return val;
}

float sCurveY(float x){
  float phase = x * 3.14159265;
  // More dramatic S-curve: amplitude 0.28 (was 0.22)
  return 0.5 + 0.28 * cos(phase) - 0.06 * sin(phase * 2.0);
}

float streamWidth(float x){
  float center = 0.5;
  float narrowing = 1.0 - 0.45 * exp(-8.0 * (x - center) * (x - center));
  float leftThick = mix(0.28, 0.13, smoothstep(0.0, 1.0, x));
  return leftThick * narrowing + 0.075;
}

vec3 getColor(float x, float yNorm){
  // All transition colors have luminance > 0.5
  vec3 redOrange  = vec3(240.0, 100.0, 50.0) / 255.0;
  vec3 orange     = vec3(248.0, 170.0, 60.0) / 255.0;
  vec3 gold       = vec3(250.0, 210.0, 75.0) / 255.0;
  vec3 magenta    = vec3(215.0, 70.0, 125.0) / 255.0;
  // 6 transition zones — all bright
  vec3 peach      = vec3(248.0, 175.0, 135.0) / 255.0;
  vec3 lightCoral = vec3(245.0, 155.0, 150.0) / 255.0;
  vec3 softMint   = vec3(160.0, 220.0, 195.0) / 255.0;
  vec3 softAqua   = vec3(130.0, 210.0, 200.0) / 255.0;
  vec3 teal       = vec3(55.0, 190.0, 178.0) / 255.0;
  vec3 green      = vec3(70.0, 178.0, 135.0) / 255.0;
  vec3 lime       = vec3(178.0, 215.0, 85.0) / 255.0;

  float t = clamp(x, 0.0, 1.0);
  vec3 topCol, midCol, botCol;

  // 6 zones for smoother gradient
  if(t < 0.2){
    float s = t / 0.2;
    topCol = mix(redOrange, orange, s);
    midCol = mix(orange, gold, s);
    botCol = mix(magenta, magenta, s);
  } else if(t < 0.35){
    float s = (t - 0.2) / 0.15;
    topCol = mix(orange, peach, s);
    midCol = mix(gold, peach, s);
    botCol = mix(magenta, lightCoral, s);
  } else if(t < 0.5){
    float s = (t - 0.35) / 0.15;
    topCol = mix(peach, softMint, s);
    midCol = mix(peach, softAqua, s);
    botCol = mix(lightCoral, softAqua, s);
  } else if(t < 0.65){
    float s = (t - 0.5) / 0.15;
    topCol = mix(softMint, softAqua, s);
    midCol = mix(softAqua, green, s);
    botCol = mix(softAqua, teal, s);
  } else if(t < 0.8){
    float s = (t - 0.65) / 0.15;
    topCol = mix(softAqua, teal, s);
    midCol = mix(green, green, s);
    botCol = mix(teal, green, s);
  } else {
    float s = (t - 0.8) / 0.2;
    topCol = mix(teal, lime, s);
    midCol = mix(green, lime, s);
    botCol = mix(green, lime, s);
  }

  float yf = clamp(yNorm * 0.5 + 0.5, 0.0, 1.0);
  vec3 col;
  if(yf < 0.5){
    col = mix(topCol, midCol, yf * 2.0);
  } else {
    col = mix(midCol, botCol, (yf - 0.5) * 2.0);
  }
  return col;
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  float aspect = u_res.x / u_res.y;
  float t = u_time * 0.035;

  vec2 p = uv;

  float cy = sCurveY(p.x);
  float sw = streamWidth(p.x);
  float rawDist = (p.y - cy) / sw;
  float dist = abs(rawDist);

  // Larger scale noise for softer character
  vec2 nCoord = vec2(p.x * 3.5 + t, p.y * 3.5 * aspect);
  float noiseDistort = fbm(nCoord, t) * 0.22;
  float noiseDistort2 = fbm(nCoord * 1.5 + 5.0, t * 0.7) * 0.12;
  float distorted = dist + noiseDistort + noiseDistort2 * (1.0 - dist);

  float sigma = 0.65;
  float mask = exp(-(distorted * distorted) / (2.0 * sigma * sigma));

  float detail = fbm(nCoord * 1.8 + vec2(t * 0.5, 0.0), t * 1.3);
  float detail2 = snoise(nCoord * 5.0 + t * 0.8) * 0.3;

  float innerFactor = smoothstep(1.0, 0.0, dist);
  mask += innerFactor * detail * 0.07;
  mask = clamp(mask, 0.0, 1.0);

  mask = pow(mask, 0.75);

  float colorX = p.x + detail * 0.04;
  float yNorm = rawDist + detail2 * 0.2;

  vec3 streamCol = getColor(colorX, yNorm);

  streamCol *= 1.0 + detail * 0.10 * innerFactor;
  streamCol = clamp(streamCol, 0.0, 1.0);

  float highlight = snoise(vec2(p.x * 8.0 - t * 2.0, rawDist * 3.0)) * 0.5 + 0.5;
  highlight = pow(highlight, 4.0) * 0.12 * innerFactor;
  streamCol += highlight;

  vec3 color = mix(vec3(1.0), streamCol, mask);

  gl_FragColor = vec4(color, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

let startTime = performance.now();

function frame() {
  const elapsed = (performance.now() - startTime) / 1000.0;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, elapsed);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
