<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - V5 Var5: Vertical 2-Stop Gradients, Dimensional Depth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(14px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

function sCurveY(x, w, h) {
  const t = x / w;
  return h * 0.5 + h * (-0.18 * Math.sin(Math.PI * t) + 0.04 * Math.sin(2 * Math.PI * t));
}

// Variation 5: Each wave uses a 2-stop vertical gradient (top color, bottom color)
// combined with horizontal color shift. This gives internal vertical color variation
// for dimensional depth. 10 waves, thicker, no violet/dark intermediates.
// Uses warm salmon, soft peach, light aqua for transitions.

const waveDefs = [
  {
    // Horizontal stops for left-right color shift
    hStops: [
      [0.0, [237, 97, 46]],
      [0.50, [250, 175, 130]],
      [1.0, [50, 185, 175]]
    ],
    // Vertical: top is lighter/brighter, bottom is deeper/richer
    topBrightness: 1.15,   // multiplier (clamped to 255)
    botBrightness: 0.85,
    topAlpha: 0.75,
    botAlpha: 0.90,
    offsetY: -0.07, amplitude: 12, phase: 0, speed: 0.38, opacity: 0.70, thickness: 0.22
  },
  {
    hStops: [
      [0.0, [240, 110, 55]],
      [0.48, [252, 190, 145]],
      [1.0, [65, 178, 140]]
    ],
    topBrightness: 1.18,
    botBrightness: 0.82,
    topAlpha: 0.70,
    botAlpha: 0.88,
    offsetY: -0.045, amplitude: 10, phase: 0.65, speed: 0.34, opacity: 0.66, thickness: 0.20
  },
  {
    hStops: [
      [0.0, [245, 166, 53]],
      [0.50, [252, 210, 150]],
      [1.0, [80, 200, 160]]
    ],
    topBrightness: 1.12,
    botBrightness: 0.88,
    topAlpha: 0.80,
    botAlpha: 0.92,
    offsetY: -0.01, amplitude: 15, phase: 1.30, speed: 0.30, opacity: 0.76, thickness: 0.26
  },
  {
    hStops: [
      [0.0, [250, 205, 75]],
      [0.48, [252, 200, 155]],
      [1.0, [120, 210, 175]]
    ],
    topBrightness: 1.15,
    botBrightness: 0.85,
    topAlpha: 0.72,
    botAlpha: 0.85,
    offsetY: 0.01, amplitude: 9, phase: 1.95, speed: 0.42, opacity: 0.62, thickness: 0.19
  },
  {
    hStops: [
      [0.0, [215, 80, 120]],
      [0.48, [250, 180, 150]],
      [1.0, [100, 210, 190]]
    ],
    topBrightness: 1.20,
    botBrightness: 0.80,
    topAlpha: 0.68,
    botAlpha: 0.88,
    offsetY: 0.035, amplitude: 12, phase: 2.60, speed: 0.36, opacity: 0.68, thickness: 0.22
  },
  {
    hStops: [
      [0.0, [210, 65, 115]],
      [0.50, [245, 170, 140]],
      [1.0, [55, 190, 175]]
    ],
    topBrightness: 1.15,
    botBrightness: 0.85,
    topAlpha: 0.65,
    botAlpha: 0.82,
    offsetY: 0.055, amplitude: 10, phase: 3.25, speed: 0.32, opacity: 0.58, thickness: 0.18
  },
  {
    hStops: [
      [0.0, [245, 155, 65]],
      [0.45, [252, 195, 150]],
      [1.0, [55, 190, 178]]
    ],
    topBrightness: 1.10,
    botBrightness: 0.90,
    topAlpha: 0.60,
    botAlpha: 0.78,
    offsetY: -0.025, amplitude: 14, phase: 3.90, speed: 0.28, opacity: 0.52, thickness: 0.20
  },
  {
    hStops: [
      [0.0, [250, 195, 80]],
      [0.50, [200, 220, 180]],
      [1.0, [175, 215, 95]]
    ],
    topBrightness: 1.12,
    botBrightness: 0.88,
    topAlpha: 0.58,
    botAlpha: 0.75,
    offsetY: 0.025, amplitude: 11, phase: 4.55, speed: 0.40, opacity: 0.48, thickness: 0.17
  },
  {
    // Extra warm layer
    hStops: [
      [0.0, [235, 90, 50]],
      [0.50, [248, 165, 120]],
      [1.0, [100, 200, 165]]
    ],
    topBrightness: 1.18,
    botBrightness: 0.82,
    topAlpha: 0.72,
    botAlpha: 0.90,
    offsetY: 0.0, amplitude: 16, phase: 5.20, speed: 0.33, opacity: 0.55, thickness: 0.24
  },
  {
    // Extra cool layer
    hStops: [
      [0.0, [220, 100, 130]],
      [0.48, [250, 185, 155]],
      [1.0, [150, 215, 200]]
    ],
    topBrightness: 1.15,
    botBrightness: 0.85,
    topAlpha: 0.62,
    botAlpha: 0.80,
    offsetY: 0.07, amplitude: 8, phase: 5.85, speed: 0.37, opacity: 0.48, thickness: 0.16
  }
];

// Interpolate color array along horizontal stops at position t (0..1)
function interpColor(hStops, t) {
  if (t <= hStops[0][0]) return hStops[0][1].slice();
  if (t >= hStops[hStops.length - 1][0]) return hStops[hStops.length - 1][1].slice();
  for (let i = 0; i < hStops.length - 1; i++) {
    const s0 = hStops[i];
    const s1 = hStops[i + 1];
    if (t >= s0[0] && t <= s1[0]) {
      const f = (t - s0[0]) / (s1[0] - s0[0]);
      return [
        Math.round(s0[1][0] + (s1[1][0] - s0[1][0]) * f),
        Math.round(s0[1][1] + (s1[1][1] - s0[1][1]) * f),
        Math.round(s0[1][2] + (s1[1][2] - s0[1][2]) * f)
      ];
    }
  }
  return hStops[0][1].slice();
}

function clamp(v) { return Math.min(255, Math.max(0, Math.round(v))); }

function drawWave(wave, time) {
  const w = W();
  const h = H();
  const halfThick = wave.thickness * h * 0.5;

  const ph = wave.phase + time * wave.speed;
  const amp = wave.amplitude;

  const segments = 40;
  const segWidth = w / segments;

  for (let seg = 0; seg < segments; seg++) {
    const x0 = seg * segWidth;
    const x1 = (seg + 1) * segWidth + 1; // slight overlap to avoid seams
    const tMid = (seg + 0.5) / segments;

    // Get horizontal color at this segment position
    const baseColor = interpColor(wave.hStops, tMid);

    // Calculate top and bottom Y for this segment's left and right edges
    const pts = [];
    for (let e = 0; e <= 1; e++) {
      const x = e === 0 ? x0 : x1;
      const t = x / w;
      const baseY = sCurveY(x, w, h) + wave.offsetY * h;
      const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
      const localThick = halfThick * (1.0 - 0.45 * t);
      pts.push({
        x: x,
        top: baseY + waveY - localThick,
        bot: baseY + waveY + localThick
      });
    }

    // Create the segment quad path
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].top);
    ctx.lineTo(pts[1].x, pts[1].top);
    ctx.lineTo(pts[1].x, pts[1].bot);
    ctx.lineTo(pts[0].x, pts[0].bot);
    ctx.closePath();

    // Create vertical gradient for this segment (top lighter, bottom richer)
    const topY = Math.min(pts[0].top, pts[1].top);
    const botY = Math.max(pts[0].bot, pts[1].bot);
    const vGrad = ctx.createLinearGradient(0, topY, 0, botY);

    const topR = clamp(baseColor[0] * wave.topBrightness);
    const topG = clamp(baseColor[1] * wave.topBrightness);
    const topB = clamp(baseColor[2] * wave.topBrightness);
    const botR = clamp(baseColor[0] * wave.botBrightness);
    const botG = clamp(baseColor[1] * wave.botBrightness);
    const botB = clamp(baseColor[2] * wave.botBrightness);

    vGrad.addColorStop(0.0, 'rgba(' + topR + ',' + topG + ',' + topB + ',' + wave.topAlpha + ')');
    vGrad.addColorStop(1.0, 'rgba(' + botR + ',' + botG + ',' + botB + ',' + wave.botAlpha + ')');

    ctx.globalAlpha = wave.opacity;
    ctx.fillStyle = vGrad;
    ctx.fill();
  }

  ctx.globalAlpha = 1.0;
}

function frame(ts) {
  const time = ts * 0.001;
  const w = W();
  const h = H();

  ctx.clearRect(0, 0, w, h);

  waveDefs.forEach(function(wave) { drawWave(wave, time); });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
