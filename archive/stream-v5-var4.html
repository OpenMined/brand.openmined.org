<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - V5 Var4: Less Taper, Slow Animation, Salmon/Peach/Aqua</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(18px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

function sCurveY(x, w, h) {
  const t = x / w;
  return h * 0.5 + h * (-0.18 * Math.sin(Math.PI * t) + 0.04 * Math.sin(2 * Math.PI * t));
}

// Variation 4: Less taper (0.25 instead of 0.45), slower speed (*0.5),
// bright vivid colors, transition through salmon/peach/aqua
const waveDefs = [
  {
    stops: [
      [0.0, 'rgba(237, 97, 46, 0.88)'],
      [0.30, 'rgba(245, 155, 75, 0.80)'],
      [0.50, 'rgba(250, 175, 130, 0.50)'],
      [0.75, 'rgba(80, 200, 190, 0.72)'],
      [1.0, 'rgba(55, 190, 178, 0.25)']
    ],
    offsetY: -0.06, amplitude: 12, phase: 0, speed: 0.20, opacity: 0.70, thickness: 0.18
  },
  {
    stops: [
      [0.0, 'rgba(240, 105, 55, 0.90)'],
      [0.28, 'rgba(240, 105, 55, 0.82)'],
      [0.48, 'rgba(248, 180, 140, 0.55)'],
      [0.70, 'rgba(100, 210, 195, 0.65)'],
      [1.0, 'rgba(70, 178, 135, 0.28)']
    ],
    offsetY: -0.035, amplitude: 10, phase: 0.8, speed: 0.175, opacity: 0.65, thickness: 0.16
  },
  {
    stops: [
      [0.0, 'rgba(245, 166, 53, 0.90)'],
      [0.28, 'rgba(250, 205, 80, 0.88)'],
      [0.50, 'rgba(252, 210, 150, 0.48)'],
      [0.72, 'rgba(75, 195, 160, 0.68)'],
      [1.0, 'rgba(175, 215, 90, 0.32)']
    ],
    offsetY: 0.0, amplitude: 14, phase: 1.6, speed: 0.15, opacity: 0.75, thickness: 0.20
  },
  {
    stops: [
      [0.0, 'rgba(250, 205, 80, 0.82)'],
      [0.25, 'rgba(248, 175, 65, 0.78)'],
      [0.50, 'rgba(250, 190, 150, 0.42)'],
      [0.72, 'rgba(120, 215, 200, 0.58)'],
      [1.0, 'rgba(180, 215, 95, 0.28)']
    ],
    offsetY: 0.015, amplitude: 8, phase: 2.4, speed: 0.225, opacity: 0.60, thickness: 0.15
  },
  {
    stops: [
      [0.0, 'rgba(210, 70, 120, 0.85)'],
      [0.28, 'rgba(230, 115, 130, 0.75)'],
      [0.48, 'rgba(250, 185, 150, 0.48)'],
      [0.72, 'rgba(110, 205, 185, 0.58)'],
      [1.0, 'rgba(180, 215, 90, 0.22)']
    ],
    offsetY: 0.045, amplitude: 11, phase: 3.2, speed: 0.19, opacity: 0.65, thickness: 0.17
  },
  {
    stops: [
      [0.0, 'rgba(210, 70, 120, 0.70)'],
      [0.25, 'rgba(240, 150, 140, 0.60)'],
      [0.50, 'rgba(200, 220, 210, 0.38)'],
      [0.72, 'rgba(60, 190, 175, 0.52)'],
      [1.0, 'rgba(70, 178, 135, 0.18)']
    ],
    offsetY: 0.065, amplitude: 9, phase: 4.0, speed: 0.16, opacity: 0.55, thickness: 0.14
  },
  {
    stops: [
      [0.0, 'rgba(248, 170, 65, 0.35)'],
      [0.38, 'rgba(250, 190, 150, 0.32)'],
      [0.58, 'rgba(60, 195, 185, 0.75)'],
      [0.80, 'rgba(55, 190, 178, 0.68)'],
      [1.0, 'rgba(70, 178, 135, 0.38)']
    ],
    offsetY: -0.025, amplitude: 13, phase: 4.8, speed: 0.14, opacity: 0.50, thickness: 0.13
  },
  {
    stops: [
      [0.0, 'rgba(250, 210, 85, 0.28)'],
      [0.32, 'rgba(252, 200, 155, 0.25)'],
      [0.55, 'rgba(100, 210, 175, 0.62)'],
      [0.80, 'rgba(180, 215, 95, 0.72)'],
      [1.0, 'rgba(180, 215, 95, 0.32)']
    ],
    offsetY: 0.03, amplitude: 10, phase: 5.6, speed: 0.21, opacity: 0.45, thickness: 0.12
  }
];

function drawWave(wave, time) {
  const w = W();
  const h = H();
  const halfThick = wave.thickness * h * 0.5;

  const ph = wave.phase + time * wave.speed;
  const amp = wave.amplitude;

  const steps = 80;
  const dx = w / steps;

  ctx.beginPath();

  for (let i = 0; i <= steps; i++) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    // Less taper: 0.25 instead of 0.45 — stream stays thick on right side
    const localThick = halfThick * (1.0 - 0.25 * t);
    const y = baseY + waveY - localThick;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  for (let i = steps; i >= 0; i--) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    // Less taper: 0.25 instead of 0.45
    const localThick = halfThick * (1.0 - 0.25 * t);
    const y = baseY + waveY + localThick;
    ctx.lineTo(x, y);
  }

  ctx.closePath();

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  wave.stops.forEach(function(s) { grad.addColorStop(s[0], s[1]); });

  ctx.globalAlpha = wave.opacity;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function frame(ts) {
  const time = ts * 0.001;
  const w = W();
  const h = H();

  ctx.clearRect(0, 0, w, h);

  waveDefs.forEach(function(wave) { drawWave(wave, time); });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
