<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - V5 Var1: Coral/Lavender Transitions, 10 Layers</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(18px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

function sCurveY(x, w, h) {
  const t = x / w;
  return h * 0.5 + h * (-0.18 * Math.sin(Math.PI * t) + 0.04 * Math.sin(2 * Math.PI * t));
}

// Variation 1: Replace violet (130,88,160) with soft coral (240,150,130) and light lavender (190,160,210)
// Increase wave thickness by 25%, 10 layers for richer blending
const waveDefs = [
  {

      [0.50, 'rgba(240, 150, 130, 0.45)'],
      [0.75, 'rgba(50, 185, 175, 0.72)'],
      [1.0, 'rgba(50, 185, 175, 0.22)']
    ],

  },
  {

      [0.0, 'rgba(237, 97, 46, 0.92)'],
      [0.30, 'rgba(237, 97, 46, 0.82)'],

    ],
    offsetY: -0.045, amplitude: 10, phase: 0.8, speed: 0.35, opacity: 0.65, thickness: 0.200
  },
  {

      [0.0, 'rgba(245, 166, 53, 0.92)'],
      [0.30, 'rgba(248, 205, 70, 0.88)'],
      [0.50, 'rgba(248, 205, 70, 0.50)'],
      [0.72, 'rgba(65, 172, 130, 0.68)'],
      [1.0, 'rgba(175, 210, 80, 0.32)']
    ],
    offsetY: -0.01, amplitude: 14, phase: 1.6, speed: 0.30, opacity: 0.75, thickness: 0.250
  },
  {

      [0.0, 'rgba(248, 205, 70, 0.82)'],
      [0.25, 'rgba(245, 166, 53, 0.78)'],
      [0.50, 'rgba(190, 160, 210, 0.40)'],
      [0.70, 'rgba(50, 185, 175, 0.58)'],
      [1.0, 'rgba(175, 210, 80, 0.28)']
    ],
    offsetY: 0.01, amplitude: 8, phase: 2.4, speed: 0.45, opacity: 0.60, thickness: 0.1875
  },
  {

  {

function drawWave(wave, time) {
  const w = W();
  const h = H();
  const halfThick = wave.thickness * h * 0.5;

  const ph = wave.phase + time * wave.speed;
  const amp = wave.amplitude;

  const steps = 80;
  const dx = w / steps;

  ctx.beginPath();

  for (let i = 0; i <= steps; i++) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    const localThick = halfThick * (1.0 - 0.45 * t);
    const y = baseY + waveY - localThick;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  for (let i = steps; i >= 0; i--) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    const localThick = halfThick * (1.0 - 0.45 * t);
    const y = baseY + waveY + localThick;
    ctx.lineTo(x, y);
  }

  ctx.closePath();

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  wave.stops.forEach(function(s) { grad.addColorStop(s[0], s[1]); });

  ctx.globalAlpha = wave.opacity;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function frame(ts) {
  const time = ts * 0.001;
  const w = W();
  const h = H();

  ctx.clearRect(0, 0, w, h);

  waveDefs.forEach(function(wave) { drawWave(wave, time); });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
