<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream v3 - Flowing Particles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Re-fill white on resize
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- S-curve definition (cubic bezier) ---
  const CP = [
    { x: -0.05, y: 0.25 },
    { x: 0.30, y: 0.73 },
    { x: 0.70, y: 0.22 },
    { x: 1.05, y: 0.32 },
  ];

  function bezier(t, p0, p1, p2, p3) {
    const u = 1 - t;
    return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
  }

  function getCurveY(t) {
    return bezier(t, CP[0].y, CP[1].y, CP[2].y, CP[3].y);
  }

  function getCurveX(t) {
    return bezier(t, CP[0].x, CP[1].x, CP[2].x, CP[3].x);
  }

  // Approximate: given normalized x (0..1), find t
  // Pre-build lookup table
  const LUT_SIZE = 512;
  const xToT = new Float32Array(LUT_SIZE);
  const tToX = new Float32Array(LUT_SIZE);
  const tToY = new Float32Array(LUT_SIZE);
  (function buildLUT() {
    for (let i = 0; i < LUT_SIZE; i++) {
      const t = i / (LUT_SIZE - 1);
      tToX[i] = getCurveX(t);
      tToY[i] = getCurveY(t);
    }
    // Build inverse: for each x bucket, find closest t
    for (let xi = 0; xi < LUT_SIZE; xi++) {
      const x = xi / (LUT_SIZE - 1);
      let bestT = 0, bestDist = 999;
      for (let ti = 0; ti < LUT_SIZE; ti++) {
        const d = Math.abs(tToX[ti] - x);
        if (d < bestDist) { bestDist = d; bestT = ti / (LUT_SIZE - 1); }
      }
      xToT[xi] = bestT;
    }
  })();

  function getCenterYAtX(nx) {
    const idx = Math.max(0, Math.min(LUT_SIZE - 1, (nx * (LUT_SIZE - 1)) | 0));
    const t = xToT[idx];
    return getCurveY(t);
  }

  function getTangentAtX(nx) {
    const eps = 0.005;
    const y0 = getCenterYAtX(Math.max(0, nx - eps));
    const y1 = getCenterYAtX(Math.min(1, nx + eps));
    const dx = 2 * eps;
    const dy = y1 - y0;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    return { tx: dx/len, ty: dy/len, nx: -dy/len, ny: dx/len };
  }

  // Stream half-width (normalized)
  function getHalfWidth(nx) {
    const center = 0.45;
    const squeeze = 1 - 0.55 * Math.exp(-((nx - center)*(nx - center)) / 0.035);
    const taper = 1 - 0.25 * nx;
    return 0.13 * squeeze * taper;
  }

  // Speed multiplier: faster in narrow center
  function getSpeed(nx) {
    const hw = getHalfWidth(nx);
    // Inverse relationship: narrower = faster
    return 0.6 / (hw / 0.13 + 0.3);
  }

  // --- Color ---
  const warmColors = [
    [230, 60, 30],
    [245, 170, 30],
    [200, 40, 120],
  ];
  const coolColors = [
    [0, 160, 160],
    [30, 170, 80],
    [140, 200, 40],
  ];

  function lerpC(a, b, t) {
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  }

  function getColor(nx, vOffset) {
    // vOffset: -1 (top of stream) to +1 (bottom)
    const vi = Math.max(0, Math.min(1, (vOffset + 1) * 0.5));
    let warm, cool;
    if (vi < 0.5) {
      warm = lerpC(warmColors[0], warmColors[1], vi * 2);
      cool = lerpC(coolColors[0], coolColors[1], vi * 2);
    } else {
      warm = lerpC(warmColors[1], warmColors[2], (vi - 0.5) * 2);
      cool = lerpC(coolColors[1], coolColors[2], (vi - 0.5) * 2);
    }
    const t = Math.max(0, Math.min(1, nx));
    // Smooth warm-cool transition
    const mix = t < 0.3 ? 0 : t > 0.7 ? 1 : (t - 0.3) / 0.4;
    const smoothMix = mix * mix * (3 - 2 * mix); // smoothstep
    return lerpC(warm, cool, smoothMix);
  }

  // --- Particles ---
  const MAX_PARTICLES = 4000;
  const particles = [];

  function spawnParticle() {
    // Spawn on left edge
    const nx = -0.02 + Math.random() * 0.04; // near left edge
    const centerY = getCenterYAtX(0);
    const hw = getHalfWidth(0);

    // Gaussian-ish distribution around center
    const u1 = Math.random();
    const u2 = Math.random();
    const gauss = Math.sqrt(-2 * Math.log(Math.max(u1, 0.0001))) * Math.cos(2 * Math.PI * u2);
    const offset = gauss * 0.35; // normalized -1..1 ish

    const ny = centerY + offset * hw;

    return {
      x: nx,
      y: ny,
      vOffset: offset, // for color
      size: 1.5 + Math.random() * 2.5,
      alpha: 0.3 + Math.random() * 0.5,
      // Small random perpendicular drift
      drift: (Math.random() - 0.5) * 0.0003,
      driftPhase: Math.random() * Math.PI * 2,
      driftFreq: 0.5 + Math.random() * 1.5,
    };
  }

  // Initialize particles spread across the stream
  for (let i = 0; i < MAX_PARTICLES; i++) {
    const p = spawnParticle();
    // Spread initial particles across the whole stream
    p.x = Math.random();
    const cy = getCenterYAtX(p.x);
    const hw = getHalfWidth(p.x);
    const u1 = Math.random();
    const u2 = Math.random();
    const gauss = Math.sqrt(-2 * Math.log(Math.max(u1, 0.0001))) * Math.cos(2 * Math.PI * u2);
    p.vOffset = gauss * 0.35;
    p.y = cy + p.vOffset * hw;
    particles.push(p);
  }

  let time = 0;
  const SPAWN_RATE = 15; // particles per frame

  function update() {
    time += 0.016;

    // Spawn new particles
    for (let s = 0; s < SPAWN_RATE; s++) {
      if (particles.length < MAX_PARTICLES) {
        particles.push(spawnParticle());
      }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const nx = p.x;
      const speed = getSpeed(nx);
      const baseSpeed = 0.0018;

      // Move along x
      p.x += baseSpeed * speed;

      // Vertical: attract toward curve center with drift
      const cy = getCenterYAtX(p.x);
      const hw = getHalfWidth(p.x);
      const targetY = cy + p.vOffset * hw;

      // Smoothly follow the target
      p.y += (targetY - p.y) * 0.08;

      // Add sinusoidal drift perpendicular to flow
      const tang = getTangentAtX(p.x);
      const driftAmt = Math.sin(time * p.driftFreq + p.driftPhase) * p.drift;
      p.y += tang.ny * driftAmt * W;
      p.x += tang.nx * driftAmt * W / W; // negligible x component

      // Remove if off-screen right
      if (p.x > 1.08) {
        particles.splice(i, 1);
      }
    }
  }

  function draw() {
    // Fade: draw semi-transparent white rect for trail effect
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.fillRect(0, 0, W, H);

    // Draw particles
    ctx.globalCompositeOperation = 'source-over';

    for (const p of particles) {
      const px = p.x * W;
      const py = p.y * H;

      // Skip if off-screen
      if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue;

      // Color based on position
      const col = getColor(p.x, p.vOffset);

      // Alpha: fade based on distance from stream center for softer edges
      const cy = getCenterYAtX(p.x);
      const hw = getHalfWidth(p.x);
      const distFromCenter = Math.abs(p.y - cy) / Math.max(hw * H, 1) * H;
      const normalizedDist = Math.abs(p.y - cy) / Math.max(hw, 0.01);
      const edgeFade = Math.exp(-(normalizedDist * normalizedDist) / 0.8);
      const alpha = p.alpha * edgeFade;

      if (alpha < 0.01) continue;

      ctx.globalAlpha = alpha;
      ctx.fillStyle = `rgb(${col[0]|0},${col[1]|0},${col[2]|0})`;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Fill white initially
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  loop();
})();
</script>
</body>
</html>
