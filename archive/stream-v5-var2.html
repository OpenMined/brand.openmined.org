<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - V5 Var2: Sharper Soft, Thick Waves, Peach/Teal Transitions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    filter: blur(12px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

// Increased S-curve amplitude to 0.22
function sCurveY(x, w, h) {
  const t = x / w;
  return h * 0.5 + h * (-0.22 * Math.sin(Math.PI * t) + 0.05 * Math.sin(2 * Math.PI * t));
}

// Variation 2: Reduced blur (12px), thicker waves (0.22-0.28), peach/soft-teal transitions
const waveDefs = [
  {
    stops: [
      [0.0, 'rgba(237, 97, 46, 0.90)'],
      [0.32, 'rgba(245, 166, 53, 0.80)'],
      [0.50, 'rgba(250, 185, 145, 0.50)'],
      [0.72, 'rgba(50, 185, 175, 0.75)'],
      [1.0, 'rgba(50, 185, 175, 0.25)']
    ],
    offsetY: -0.07, amplitude: 13, phase: 0, speed: 0.40, opacity: 0.72, thickness: 0.26
  },
  {
    stops: [
      [0.0, 'rgba(237, 97, 46, 0.92)'],
      [0.28, 'rgba(237, 97, 46, 0.85)'],
      [0.48, 'rgba(250, 185, 145, 0.55)'],
      [0.70, 'rgba(150, 215, 200, 0.65)'],
      [1.0, 'rgba(65, 172, 130, 0.30)']
    ],
    offsetY: -0.04, amplitude: 11, phase: 0.75, speed: 0.36, opacity: 0.68, thickness: 0.24
  },
  {
    stops: [
      [0.0, 'rgba(245, 166, 53, 0.92)'],
      [0.28, 'rgba(248, 205, 70, 0.88)'],
      [0.50, 'rgba(250, 185, 145, 0.48)'],
      [0.72, 'rgba(65, 172, 130, 0.70)'],
      [1.0, 'rgba(175, 210, 80, 0.35)']
    ],
    offsetY: -0.005, amplitude: 15, phase: 1.5, speed: 0.30, opacity: 0.78, thickness: 0.28
  },
  {
    stops: [
      [0.0, 'rgba(248, 205, 70, 0.85)'],
      [0.25, 'rgba(245, 166, 53, 0.80)'],
      [0.50, 'rgba(250, 185, 145, 0.42)'],
      [0.72, 'rgba(150, 215, 200, 0.60)'],
      [1.0, 'rgba(175, 210, 80, 0.28)']
    ],
    offsetY: 0.015, amplitude: 9, phase: 2.25, speed: 0.44, opacity: 0.62, thickness: 0.23
  },
  {
    stops: [
      [0.0, 'rgba(200, 55, 115, 0.88)'],
      [0.28, 'rgba(220, 100, 130, 0.75)'],
      [0.50, 'rgba(250, 185, 145, 0.50)'],
      [0.72, 'rgba(150, 215, 200, 0.58)'],
      [1.0, 'rgba(175, 210, 80, 0.25)']
    ],
    offsetY: 0.045, amplitude: 12, phase: 3.0, speed: 0.38, opacity: 0.68, thickness: 0.25
  },
  {
    stops: [
      [0.0, 'rgba(200, 55, 115, 0.72)'],
      [0.25, 'rgba(250, 185, 145, 0.60)'],
      [0.50, 'rgba(150, 215, 200, 0.45)'],
      [0.75, 'rgba(50, 185, 175, 0.55)'],
      [1.0, 'rgba(65, 172, 130, 0.20)']
    ],
    offsetY: 0.065, amplitude: 10, phase: 3.75, speed: 0.33, opacity: 0.58, thickness: 0.22
  },
  {
    stops: [
      [0.0, 'rgba(245, 166, 53, 0.38)'],
      [0.35, 'rgba(250, 185, 145, 0.35)'],
      [0.55, 'rgba(50, 185, 175, 0.78)'],
      [0.78, 'rgba(50, 185, 175, 0.70)'],
      [1.0, 'rgba(65, 172, 130, 0.40)']
    ],
    offsetY: -0.025, amplitude: 14, phase: 4.5, speed: 0.28, opacity: 0.52, thickness: 0.24
  },
  {
    stops: [
      [0.0, 'rgba(248, 205, 70, 0.30)'],
      [0.35, 'rgba(250, 185, 145, 0.28)'],
      [0.55, 'rgba(150, 215, 200, 0.65)'],
      [0.80, 'rgba(175, 210, 80, 0.75)'],
      [1.0, 'rgba(175, 210, 80, 0.35)']
    ],
    offsetY: 0.03, amplitude: 11, phase: 5.25, speed: 0.42, opacity: 0.48, thickness: 0.22
  }
];

function drawWave(wave, time) {
  const w = W();
  const h = H();
  const halfThick = wave.thickness * h * 0.5;

  const ph = wave.phase + time * wave.speed;
  const amp = wave.amplitude;

  const steps = 80;
  const dx = w / steps;

  ctx.beginPath();

  for (let i = 0; i <= steps; i++) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    const localThick = halfThick * (1.0 - 0.45 * t);
    const y = baseY + waveY - localThick;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  for (let i = steps; i >= 0; i--) {
    const x = i * dx;
    const baseY = sCurveY(x, w, h) + wave.offsetY * h;
    const t = x / w;
    const waveY = amp * Math.sin(ph + t * 6.0) + (amp * 0.4) * Math.sin(ph * 1.3 + t * 10.0);
    const localThick = halfThick * (1.0 - 0.45 * t);
    const y = baseY + waveY + localThick;
    ctx.lineTo(x, y);
  }

  ctx.closePath();

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  wave.stops.forEach(function(s) { grad.addColorStop(s[0], s[1]); });

  ctx.globalAlpha = wave.opacity;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function frame(ts) {
  const time = ts * 0.001;
  const w = W();
  const h = H();

  ctx.clearRect(0, 0, w, h);

  waveDefs.forEach(function(wave) { drawWave(wave, time); });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
