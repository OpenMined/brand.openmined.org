<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMined Stream - Domain Warp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #fallback { display: none; padding: 2em; font-family: sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p id="fallback">WebGL is not supported in this browser.</p>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false });
if (!gl) {
  canvas.style.display = 'none';
  document.getElementById('fallback').style.display = 'block';
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const vsrc = `
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const fsrc = `
precision highp float;
uniform float u_time;
uniform vec2  u_res;

/* ---- Ashima Arts simplex 2D noise ---- */
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0*fract(p*C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
  vec3 g; g.x = a0.x*x0.x + h.x*x0.y; g.yz = a0.yz*x12.xz + h.yz*x12.yw;
  return 130.0 * dot(m, g);
}

/* ---- fbm ---- */
float fbm(vec2 p){
  float f = 0.0, a = 0.5;
  for(int i = 0; i < 5; i++){
    f += a * snoise(p);
    p *= 2.07;
    a *= 0.48;
  }
  return f;
}

/* ---- domain warp (3 levels) ---- */
vec2 warp(vec2 p, float t){
  float n1x = fbm(p + vec2(1.7, 9.2) + 0.08 * t);
  float n1y = fbm(p + vec2(8.3, 2.8) - 0.06 * t);
  vec2 q = vec2(n1x, n1y);

  float n2x = fbm(p + 3.2 * q + vec2(1.2, 3.4) + 0.05 * t);
  float n2y = fbm(p + 3.2 * q + vec2(5.2, 1.3) - 0.07 * t);
  vec2 r = vec2(n2x, n2y);

  float n3x = fbm(p + 2.5 * r + vec2(3.1, 7.7) + 0.04 * t);
  float n3y = fbm(p + 2.5 * r + vec2(6.8, 4.1) - 0.03 * t);

  return p + 0.6 * vec2(n3x, n3y);
}

/* ---- S-curve path ---- */
float sCurve(float x){
  return -0.22 * sin(3.14159 * x) + 0.05 * sin(6.28318 * x);
}

/* ---- Color palette ---- */
vec3 warmCool(float t, float vOff){
  vec3 redOrange = vec3(0.929, 0.380, 0.180);
  vec3 orange    = vec3(0.961, 0.651, 0.208);
  vec3 gold      = vec3(0.973, 0.804, 0.275);
  vec3 magenta   = vec3(0.784, 0.216, 0.451);
  vec3 violet    = vec3(0.510, 0.345, 0.627);

  vec3 teal  = vec3(0.196, 0.725, 0.686);
  vec3 green = vec3(0.255, 0.675, 0.510);
  vec3 lime  = vec3(0.686, 0.824, 0.314);

  float vn = vOff * 0.5 + 0.5;
  vec3 warmTop = mix(redOrange, orange, t * 2.0);
  vec3 warmMid = mix(orange, gold, t * 2.0);
  vec3 warmBot = mix(magenta, violet, t * 2.0);
  vec3 warm = mix(warmTop, warmMid, smoothstep(0.25, 0.55, vn));
  warm = mix(warm, warmBot, smoothstep(0.55, 0.85, vn));

  vec3 coolTop = teal;
  vec3 coolMid = green;
  vec3 coolBot = lime;
  vec3 cool = mix(coolTop, coolMid, smoothstep(0.25, 0.55, vn));
  cool = mix(cool, coolBot, smoothstep(0.55, 0.85, vn));

  float blend = smoothstep(0.3, 0.7, t);
  return mix(warm, cool, blend);
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  float aspect = u_res.x / u_res.y;
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y - 0.5);

  float t = u_time;

  vec2 wp = warp(p * 1.8, t);

  float sx = uv.x;
  float curveY = sCurve(sx);
  float dy = (uv.y - 0.5) - curveY;

  float thickness = mix(0.22, 0.10, sx);
  float noiseMod = 0.04 * snoise(vec2(sx * 3.0 + t * 0.1, t * 0.05));
  thickness += noiseMod;

  float mask = 1.0 - smoothstep(0.0, thickness, abs(dy));
  float warpEdge = 0.03 * fbm(wp * 3.0 + vec2(t * 0.1, 0.0));
  mask *= 1.0 - smoothstep(thickness * 0.5, thickness + 0.06 + warpEdge, abs(dy));

  float vOff = clamp(dy / max(thickness, 0.01), -1.0, 1.0);

  float colorX = clamp((wp.x / aspect + 0.5), 0.0, 1.0);
  colorX = mix(sx, colorX, 0.4);

  vec3 col = warmCool(colorX, vOff);

  col = pow(col, vec3(0.9));
  col = mix(col, col * 1.15, mask);

  float innerGlow = exp(-3.0 * abs(dy) / max(thickness, 0.01));
  col += 0.08 * innerGlow * col;

  vec3 bg = vec3(1.0);
  vec3 finalCol = mix(bg, col, mask * 0.92);

  float sparkle = snoise(vec2(sx * 40.0 - t * 2.0, dy * 60.0));
  sparkle = smoothstep(0.85, 0.95, sparkle) * mask * 0.12;
  finalCol += sparkle * col;

  gl_FragColor = vec4(finalCol, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const vs = compile(gl.VERTEX_SHADER, vsrc);
const fs = compile(gl.FRAGMENT_SHADER, fsrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes  = gl.getUniformLocation(prog, 'u_res');

function frame(ts) {
  gl.uniform1f(uTime, ts * 0.001);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
