name: Deploy to Cloudflare Pages

# Auto-deploy brand.openmined.org to CF Pages project "brand-openmined-org"
# whenever main is updated. Replaces the legacy GitHub Pages deploy.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Branch is pinned to "main" — workflow only triggers on main pushes
          # and manual dispatches, so no risk of arbitrary-branch injection here.
          command: pages deploy . --project-name=brand-openmined-org --branch=main
